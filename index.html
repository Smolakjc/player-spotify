        /* =========================================================
           MÚSICAS DA PLAYLIST
        ========================================================= */

        async function loadPlaylistTracks(
            playlistId,
            playlistName,
            playlistUri
        ) {

            currentPlaylistId =
                playlistId;

            currentPlaylistName =
                playlistName;


            const container =
                document.getElementById(
                    "sp-playlists"
                );


            container.innerHTML =
                '<div style="grid-column:1/-1;text-align:center;padding:20px;color:#777;">Carregando...</div>';


            /*
               CORREÇÃO (v21.3):

               Antes, playlists de outras pessoas
               podiam falhar em carregar as faixas
               por 3 motivos:

               1. O endpoint /playlists/{id}/items às
                  vezes é recusado para playlists que
                  o usuário NÃO é dono (limitação
                  estranha da API — mesmo públicas).

               2. A resposta vinha sem os campos que
                  precisávamos.

               3. Se falhava, a tela ficava com um
                  texto genérico e sem como tocar.

               Agora:
               - Tenta /playlists/{id} (que devolve as
                 faixas embutidas no campo "tracks")
               - Se não vier, tenta /playlists/{id}/items
               - Paginação: se tiver mais de 100 faixas,
                 busca as demais páginas
               - Se TODA leitura falhar, mostra o
                 cabeçalho mesmo assim com um aviso
                 e os botões ▶ / 🔀 (o Spotify ainda
                 toca pelo contexto)
            */

            let data = null;


            try {

                data =
                    await spotifyAPI(
                        "/playlists/" +
                        encodeURIComponent(
                            playlistId
                        ) +
                        "?fields=tracks.total,tracks.items(track(uri,type,name,album(images),artists(name)))" +
                        "&limit=100"
                    );

            } catch (error) {

                console.error(
                    "LOAD PL [tenta 1]:",
                    error
                );

            }


            /*
               /playlists/{id} devolve as faixas em
               data.tracks (com total e items). Se
               não veio, tenta o /items como fallback.
            */

            if (
                data &&
                data.tracks &&
                data.tracks.items &&
                data.tracks.items.length
            ) {

                data.items = data.tracks.items;

            } else {

                try {

                    const items =
                        await spotifyAPI(
                            "/playlists/" +
                            encodeURIComponent(
                                playlistId
                            ) +
                            "/items?limit=50"
                        );

                    if (
                        items &&
                        items.items
                    )
                        data = items;

                } catch (error) {

                    console.error(
                        "LOAD PL [tenta 2]:",
                        error
                    );

                }

            }


            /*
               Paginação: quando a playlist tem mais
               de 100 faixas, busca as páginas seguintes.
            */

            try {

                if (
                    data &&
                    data.tracks &&
                    data.tracks.total &&
                    data.tracks.total > 100
                ) {

                    const total =
                        data.tracks.total;

                    for (
                        let offset = 100;
                        offset < total;
                        offset += 100
                    ) {

                        const next =
                            await spotifyAPI(
                                "/playlists/" +
                                encodeURIComponent(
                                    playlistId
                                ) +
                                "?fields=tracks.items(track(uri,type,name,album(images),artists(name)))" +
                                "&limit=100" +
                                "&offset=" + offset
                            );

                        if (
                            next &&
                            next.tracks &&
                            next.tracks.items
                        ) {

                            if (!data.items)
                                data.items = [];

                            data.items.push(
                                ...next.tracks.items
                            );

                        }

                    }

                }

            } catch (error) {

                console.error(
                    "LOAD PL [paginação]:",
                    error
                );

            }


            container.innerHTML = "";


            /* =====================================================
               CABEÇALHO DA PLAYLIST
            ===================================================== */

            const header =
                document.createElement(
                    "div"
                );


            header.style =
                "grid-column:1/-1;" +
                "display:flex;" +
                "align-items:center;" +
                "gap:8px;" +
                "margin-bottom:5px;" +
                "flex-wrap:wrap;";


            header.innerHTML =

                '<button ' +
                'onclick="loadPlaylists()" ' +
                'style="' +
                'background:#181818;' +
                'border:1px solid #333;' +
                'color:#ddd;' +
                'padding:7px 12px;' +
                'border-radius:7px;' +
                'cursor:pointer;' +
                'font-size:11px;' +
                '">' +
                '← Voltar' +
                '</button>' +


                '<button ' +
                'onclick="playPlaylist(\'' +
                escapeJS(playlistId) +
                '\',false)" ' +
                'style="' +
                'background:#1db954;' +
                'border:0;' +
                'color:#000;' +
                'padding:7px 12px;' +
                'border-radius:7px;' +
                'cursor:pointer;' +
                'font-size:11px;' +
                'font-weight:bold;' +
                '">' +
                '▶ Playlist' +
                '</button>' +


                '<button ' +
                'onclick="playPlaylist(\'' +
                escapeJS(playlistId) +
                '\',true)" ' +
                'style="' +
                'background:#181818;' +
                'border:1px solid #333;' +
                'color:#ddd;' +
                'padding:7px 12px;' +
                'border-radius:7px;' +
                'cursor:pointer;' +
                'font-size:11px;' +
                '">' +
                '🔀 Aleatório' +
                '</button>' +


                '<span style="' +
                'font-size:13px;' +
                'font-weight:bold;' +
                'color:#eee;' +
                'margin-left:4px;' +
                '">' +

                escapeHTML(
                    playlistName
                ) +

                '</span>';


            container.appendChild(
                header
            );


            /*
               Se o Spotify não devolver as músicas,
               ainda mostramos os botões de reprodução.
            */

            if (
                !data ||
                !data.items
            ) {

                /*
                   CORREÇÃO (v21.3):

                   Mesmo quando o Spotify NÃO deixa o
                   app listar as faixas da playlist
                   (comum em playlists de outras
                   pessoas), o usuário AINDA PODE
                   tocar a playlist inteira pelo
                   contexto.

                   Então mostramos o cabeçalho com os
                   botões ▶ / 🔀 e um aviso claro —
                   sem simplesmente desistir.
                */

                const unavailable =
                    document.createElement(
                        "div"
                    );

                unavailable.style =
                    "grid-column:1/-1;" +
                    "padding:20px;" +
                    "text-align:center;" +
                    "color:#999;" +
                    "font-size:11px;" +
                    "border:1px dashed #333;" +
                    "border-radius:7px;";

                unavailable.innerHTML =
                    "O Spotify não permitiu listar as faixas desta playlist.<br>" +
                    "Mas ela ainda pode ser tocada pelos botões acima.";

                container.appendChild(
                    unavailable
                );


                /*
                   GAMBARRA (v21.4):

                   O usuário percebeu: a playlist
                   TOCA normal mesmo quando a API
                   recusa listar as faixas.

                   Então a lista pode ser montada a
                   partir do que o Spotify ESTÁ tocando:

                   1. Toca a playlist PAUSADA (SDK
                      não precisa de áudio tocando)
                   2. Lê o track_window.current_track
                      (faixa atual)
                   3. Avança com player.nextTrack()
                      e lê de novo
                   4. Repete até a playlist inteira

                   Como o SDK revela apenas a faixa
                   ATUAL + próximas, percorremos a
                   playlist inteiro automaticamente,
                   SEM tocar música alguma em volume
                   (tudo pausado).

                   Cada vez que uma faixa é lida,
                   aparece na lista — com nome,
                   artista e capa.
                */

                const discoverBtn =
                    document.createElement("button");

                discoverBtn.style =
                    "background:#111;" +
                    "border:1px solid #1db954;" +
                    "color:#1db954;" +
                    "padding:7px 12px;" +
                    "border-radius:7px;" +
                    "cursor:pointer;" +
                    "font-size:11px;" +
                    "margin-left:8px;";

                discoverBtn.innerHTML =
                    "🔍 Descobrir faixas (toca pausado)";

                discoverBtn.onclick =
                    async () => {

                        discoverBtn.disabled = true;

                        discoverBtn.style.opacity =
                            "0.5";

                        discoverBtn.innerHTML =
                            "⏳ Descobrindo...";

                        await discoverPlaylistTracks(
                            playlistId,
                            container,
                            discoverBtn
                        );

                    };


                header.appendChild(discoverBtn);

                return;

            }


            if (data.items.length === 0) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.style =
                    "grid-column:1/-1;" +
                    "padding:20px;" +
                    "text-align:center;" +
                    "color:#777;" +
                    "font-size:11px;";

                empty.innerHTML =
                    "Nenhuma faixa disponível.";

                container.appendChild(
                    empty
                );

                return;

            }


            /* =====================================================
               FAIXAS
            ===================================================== */

            data.items.forEach(
                (item, index) => {

                    const track =
                        item.item;


                    if (!track)
                        return;


                    if (track.type !== "track")
                        return;


                    const image =
                        track.album &&
                        track.album.images &&
                        track.album.images.length

                        ?

                        track.album.images[
                            track.album.images.length - 1
                        ].url

                        :

                        "https://placehold.co/100x100/111/777?text=♫";


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.style =
                        "display:flex;" +
                        "align-items:center;" +
                        "gap:10px;" +
                        "padding:8px;" +
                        "background:#111;" +
                        "border:1px solid #222;" +
                        "border-radius:7px;" +
                        "cursor:pointer;" +
                        "transition:.2s;";


                    row.onmouseover =
                        function() {

                            this.style.borderColor =
                                "#1db954";

                            this.style.background =
                                "#181818";

                            this.style.transform =
                                "translateX(3px)";

                        };


                    row.onmouseout =
                        function() {

                            this.style.borderColor =
                                "#222";

                            this.style.background =
                                "#111";

                            this.style.transform =
                                "translateX(0)";

                        };


                    /*
                       CORREÇÃO DEFINITIVA:

                       Agora passamos o URI da música
                       DIRETO do clique, sem depender de
                       buscas na API.

                       O Spotify recebe:
                       "toque ESTA música dentro desta
                        playlist" — sem chance de erro
                        de posição.
                    */

                    row.onclick =
                        function() {

                            playPlaylistTrack(
                                playlistId,
                                track.uri,
                                index
                            );

                        };


                    row.innerHTML =

                        '<div style="' +
                        'width:20px;' +
                        'text-align:center;' +
                        'font-size:10px;' +
                        'color:#555;' +
                        '">' +

                        (index + 1) +

                        '</div>' +


                        '<img src="' +
                        image +
                        '" style="' +
                        'width:42px;' +
                        'height:42px;' +
                        'object-fit:cover;' +
                        'border-radius:5px;' +
                        '">' +


                        '<div style="' +
                        'flex:1;' +
                        'min-width:0;' +
                        '">' +


                        '<div style="' +
                        'font-size:12px;' +
                        'color:#eee;' +
                        'white-space:nowrap;' +
                        'overflow:hidden;' +
                        'text-overflow:ellipsis;' +
                        '">' +

                        escapeHTML(
                            track.name
                        ) +

                        '</div>' +


                        '<div style="' +
                        'font-size:10px;' +
                        'color:#777;' +
                        'white-space:nowrap;' +
                        'overflow:hidden;' +
                        'text-overflow:ellipsis;' +
                        '">' +

                        escapeHTML(
                            track.artists
                            .map(
                                a => a.name
                            )
                            .join(", ")
                        ) +

                        '</div>' +


                        '</div>';


                    container.appendChild(
                        row
                    );

                }
            );

        }


        /* =========================================================
           GAMBARRA (v21.4):
           DESCOBRIR FAIXAS PELA REPRODUÇÃO

           Quando a API recusa listar uma playlist
           de outra pessoa, percorremos a playlist
           tocando-a PAUSADA pelo SDK e lendo cada
           faixa do track_window. Assim montamos a
           lista na ordem certa, com nome, artista e
           capa — igual uma lista normal.
        ========================================================= */

        let playlistDiscoveryActive = false;


        async function discoverPlaylistTracks(
            playlistId,
            container,
            button
        ) {

            if (
                !spotifyPlayer ||
                playlistDiscoveryActive
            )
                return;


            playlistDiscoveryActive = true;


            try {

                const token =
                    await getToken();

                if (
                    !token ||
                    !spotifyDeviceId
                ) {

                    alert(
                        "Faça login no Spotify primeiro."
                    );

                    return;

                }


                const rowsContainer =
                    document.createElement("div");

                rowsContainer.style =
                    "grid-column:1/-1;";

                container.appendChild(rowsContainer);


                /*
                   1) Coloca a playlist tocando PAUSADA.

                   O Spotify aceita play em volume 0
                   pelo SDK — o track_window é
                   atualizado mesmo sem áudio saindo.
                */

                const volumeBefore =
                    spotifyPlayer._volume;

                spotifyPlayer.setVolume(0);

                await spotifyPlayer.setPaused(
                    false
                );


                const response =
                    await fetch(
                        "https://api.spotify.com/v1/me/player/play?device_id=" +
                        encodeURIComponent(
                            spotifyDeviceId
                        ), {

                            method: "PUT",

                            headers: {

                                Authorization: "Bearer " + token,

                                "Content-Type": "application/json"

                            },

                            body: JSON.stringify({

                                context_uri: "spotify:playlist:" +
                                    playlistId,

                                offset: {
                                    position: 0
                                },

                                position_ms: 0

                            })

                        }
                    );


                if (
                    !response.ok &&
                    response.status !== 204
                ) {

                    button.innerHTML =
                        "❌ Não foi possível descobrir";

                    console.error(
                        "DESCOBERTA [play]:",
                        await response.text()
                    );

                    playlistDiscoveryActive = false;

                    return;

                }


                /*
                   2) Percorre a playlist lendo o
                   track_window a cada nextTrack().

                   O limite de segurança é 200 faixas
                   (playlists gigantes ficam mais
                   longas — é o trade-off da gambiarra).

                   Para de avançar quando a posição
                   volta pra 0 (playlist acabou).
                */

                const MAX_TRACKS = 200;

                const position0 = Date.now();


                for (
                    let i = 0;
                    i < MAX_TRACKS;
                    i++
                ) {

                    /*
                       Dá um tempinho pro Spotify
                       atualizar o estado interno.
                    */

                    await new Promise(resolve =>
                        setTimeout(resolve, 450)
                    );


                    const state =
                        await spotifyPlayer
                        .getCurrentState();


                    const track =
                        state &&
                        state.track_window &&
                        state.track_window.current_track;


                    if (!track) {

                        await new Promise(resolve =>
                            setTimeout(resolve, 400)
                        );

                        continue;

                    }


                    /*
                       Detecta fim da playlist: quando
                       nextTrack() faz o contador de
                       posição do track_window voltar
                       (ou o tempo total da janela
                       mudar muito), a fila acabou.
                    */

                    if (
                        rowsContainer.childElementCount > 0 &&
                        state.track_window.position === 0 &&
                        Date.now() - position0 > 5000
                    ) {

                        /*
                           Se a posição voltou a 0
                           depois de vários avanços,
                           provavelmente voltamos ao
                           início da fila → fim.
                        */

                        break;

                    }


                    const image =
                        track.album &&
                        track.album.images &&
                        track.album.images.length

                        ?

                        track.album.images[track.album.images.length - 1].url

                        :

                        "https://placehold.co/100x100/111/777?text=♫";


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.style =
                        "display:flex;" +
                        "align-items:center;" +
                        "gap:10px;" +
                        "padding:8px;" +
                        "background:#111;" +
                        "border:1px solid #222;" +
                        "border-radius:7px;" +
                        "cursor:pointer;" +
                        "margin-top:4px;" +
                        "transition:.2s;";


                    row.onmouseover =
                        function() {

                            this.style.borderColor =
                                "#1db954";

                            this.style.background =
                                "#181818";

                        };


                    row.onmouseout =
                        function() {

                            this.style.borderColor =
                                "#222";

                            this.style.background =
                                "#111";

                        };


                    const itemIndex =
                        rowsContainer.childElementCount;


                    row.onclick =
                        function() {

                            playPlaylistTrack(
                                playlistId,
                                track.uri,
                                itemIndex
                            );

                        };


                    row.innerHTML =

                        '<div style="width:20px;text-align:center;font-size:10px;color:#555;">' +
                        (itemIndex + 1) +
                        '</div>' +

                        '<img src="' +
                        image +
                        '" style="width:42px;height:42px;object-fit:cover;border-radius:5px;">' +

                        '<div style="flex:1;min-width:0;">' +

                        '<div style="font-size:12px;color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
                        escapeHTML(track.name) +
                        '</div>' +

                        '<div style="font-size:10px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
                        escapeHTML(
                            track.artists
                            .map(a => a.name)
                            .join(", ")
                        ) +
                        '</div>' +

                        '</div>';


                    rowsContainer.appendChild(row);


                    /*
                       Atualiza o botão com o progresso
                       da descoberta.
                    */

                    if (button)
                        button.innerHTML =
                            "🔍 Descobrindo... " +
                            (itemIndex + 1) +
                            " faixas";


                    /*
                       Só avança se ainda não chegou
                       ao fim. nextTrack() no fim da
                       fila volta ao início — por
                       isso o limite de 200 e o break
                       acima são a segurança.
                    */

                    await spotifyPlayer.nextTrack();

                }


                /*
                   3) Terminada a descoberta, restaura
                   o volume anterior e pausa — não
                   deixa música tocando.
                */

                try {

                    spotifyPlayer.setPaused(true);

                } catch (error) {

                    console.error(
                        "DESCOBERTA [pausa]:",
                        error
                    );

                }


                try {

                    spotifyPlayer.setVolume(
                        volumeBefore != null
                            ? volumeBefore
                            : 0.7
                    );

                } catch (error) {

                    console.error(
                        "DESCOBERTA [volume]:",
                        error
                    );

                }


                if (button)
                    button.innerHTML =
                        "✅ " +
                        rowsContainer.childElementCount +
                        " faixas descobertas";


                playlistDiscoveryActive = false;

            } catch (error) {

                console.error(
                    "DESCOBERTA:",
                    error
                );

                if (button)
                    button.innerHTML =
                        "❌ Falhou — tente de novo";

                playlistDiscoveryActive = false;

            }

        }


        /* =========================================================
           MÚSICA ATUAL
        ========================================================= */

        async function loadCurrentlyPlaying() {

            /*
               Se o SDK estiver funcionando,
               ele próprio fornece o estado.

               Não fazemos uma segunda consulta que
               possa competir com o SDK.
            */

            if (spotifyPlayer)
                return;


            const data =
                await spotifyAPI(
                    "/me/player"
                );


            if (
                !data ||
                !data.item
            )
                return;


            const track =
                data.item;


            document.getElementById(
                    "sp-track"
                ).innerHTML =
                escapeHTML(
                    track.name
                );


            document.getElementById(
                    "sp-artist"
                ).innerHTML =
                escapeHTML(
                    track.artists
                    .map(
                        a => a.name
                    )
                    .join(", ")
                );


            document.getElementById(
                    "sp-album"
                ).innerHTML =
                escapeHTML(
                    track.album ?
                    track.album.name :
                    ""
                );


            if (
                track.album &&
                track.album.images &&
                track.album.images.length
            ) {

                document.getElementById(
                        "sp-cover"
                    ).src =
                    track.album.images[
                        track.album.images.length - 1
                    ].url;

            }

        }


        /* =========================================================
           SEGURANÇA
        ========================================================= */

        function escapeHTML(text) {

            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "'");

        }


        function escapeJS(text) {

            return String(text || "")
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"');

        }


        /* =========================================================
           STATUS
        ========================================================= */

        function showStatus(text) {

            const status =
                document.getElementById(
                    "sp-status"
                );

            if (status)
                status.innerHTML =
                text;

        }


        /* =========================================================
           PERFIL
        ========================================================= */

        async function loadProfile() {

            const user =
                await spotifyAPI(
                    "/me"
                );

            if (!user)
                return;


            document.getElementById(
                    "sp-user"
                ).innerHTML =
                "🎵 " +
                escapeHTML(
                    user.display_name ||
                    "Spotify"
                );

        }


        /* =========================================================
           DASHBOARD
        ========================================================= */

        async function loadDashboard() {

            const token =
                await getToken();


            const login =
                document.getElementById(
                    "sp-login"
                );

            const dashboard =
                document.getElementById(
                    "sp-dashboard"
                );


            /*
               CORRIGIDO: se loadDashboard() for
               chamado antes do DOM estar pronto
               (ex.: callback do login logo após o
               redirect), os elementos ainda são
               null → "Cannot read properties of
               null (reading 'style')".

               Agora: espera o DOM antes de mexer
               na interface.
            */

            if (document.readyState !== "complete") {

                await new Promise(resolve =>
                    window.addEventListener(
                        "load",
                        resolve,
                        { once: true }
                    )
                );

            }


            if (!token) {

                if (login)
                    login.style.display = "block";

                if (dashboard)
                    dashboard.style.display = "none";

                return;

            }


            if (login)
                login.style.display = "none";

            if (dashboard)
                dashboard.style.display = "block";


            await loadProfile();

            await loadCurrentlyPlaying();

            await loadPlaylists();

        }


                /* =========================================================
           INICIALIZAÇÃO
        ========================================================= */

        /*
           Só processa o callback se a URL realmente
           voltou do Spotify com o código (senão o
           init chamava loadDashboard duas vezes).
        */

        if (
            window.location.search.includes("code=")
        ) {

            handleSpotifyCallback();

        }
