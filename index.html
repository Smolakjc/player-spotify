<div style="width: 100%; max-width: 850px; margin: 20px auto; padding: 10px; background: rgb(8, 8, 8); border: 1px solid rgb(48, 48, 48); border-radius: 14px; box-shadow: rgba(0, 0, 0, 0.65) 0px 10px 35px; font-family: Arial, Helvetica, sans-serif; color: rgb(238, 238, 238); box-sizing: border-box; --darkreader-inline-bgimage: initial; --darkreader-inline-bgcolor: var(--darkreader-background-080808, #060707); --darkreader-inline-border-top: var(--darkreader-border-303030, #7c7366); --darkreader-inline-border-right: var(--darkreader-border-303030, #7c7366); --darkreader-inline-border-bottom: var(--darkreader-border-303030, #7c7366); --darkreader-inline-border-left: var(--darkreader-border-303030, #7c7366); --darkreader-inline-boxshadow: var(--darkreader-background-000000a6, rgba(0, 0, 0, 0.65)) 0px 10px 35px; --darkreader-inline-color: var(--darkreader-text-eeeeee, #dddad6);" data-darkreader-inline-bgimage="" data-darkreader-inline-bgcolor="" data-darkreader-inline-border-top="" data-darkreader-inline-border-right="" data-darkreader-inline-border-bottom="" data-darkreader-inline-border-left="" data-darkreader-inline-boxshadow="" data-darkreader-inline-color="" bis_skin_checked="1">

    <script src="https://sdk.scdn.co/spotify-player.js"></script>

    <script>
        /* =========================================================
   CONFIGURAÇÃO
========================================================= */

        const SPOTIFY_CLIENT_ID = "4Segredo";

        const SPOTIFY_REDIRECT_URI =
            "https://virtual.ifro.edu.br/vilhena/my/index.php";

        /*
           CORREÇÃO CRÍTICA:

           O scope "streaming" é OBRIGATÓRIO para o Web
           Playback SDK reproduzir áudio.

           Sem ele o SDK retorna "Invalid token scopes"
           (linha SDK AUTH do console) e os pedidos de
           licença do áudio dão 403 — a música toca por
           ~10 segundos e para.

           IMPORTANTE: mudar o scope aqui NÃO basta.
           Você PRECISA conectar novamente ao Spotify
           (clicar em CONECTAR AO SPOTIFY) para receber
           um token com os novos scopes.
        */

        const SPOTIFY_SCOPES =
            "streaming " +
            "user-read-private " +
            "user-read-email " +
            "user-read-currently-playing " +
            "user-read-playback-state " +
            "user-modify-playback-state " +
            "playlist-read-private " +
            "playlist-read-collaborative";


        /* =========================================================
           VARIÁVEIS
        ========================================================= */

        let spotifyPlayer = null;
        let spotifyDeviceId = null;

        let currentPlaylistId = null;
        let currentPlaylistName = null;

        let spotifyCommandRunning = false;


        /* =========================================================
           PKCE
        ========================================================= */

        function randomString(length) {

            const chars =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

            let result = "";

            for (let i = 0; i < length; i++) {

                result += chars.charAt(
                    Math.floor(Math.random() * chars.length)
                );

            }

            return result;
        }


        async function generateCodeChallenge(verifier) {

            const data =
                new TextEncoder().encode(verifier);

            const digest =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );

            return btoa(
                    String.fromCharCode(
                        ...new Uint8Array(digest)
                    )
                )
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/, "");
        }


        /* =========================================================
           LOGIN
        ========================================================= */

        async function spotifyLogin() {

            const verifier =
                randomString(128);

            const challenge =
                await generateCodeChallenge(verifier);

            const state =
                randomString(32);

            localStorage.setItem(
                "sp_verifier",
                verifier
            );

            localStorage.setItem(
                "sp_state",
                state
            );

            const params =
                new URLSearchParams({

                    client_id: SPOTIFY_CLIENT_ID,

                    response_type: "code",

                    redirect_uri: SPOTIFY_REDIRECT_URI,

                    scope: SPOTIFY_SCOPES,

                    state: state,

                    code_challenge_method: "S256",

                    code_challenge: challenge

                });

            window.location.href =
                "https://accounts.spotify.com/authorize?" +
                params.toString();
        }


        /* =========================================================
           CALLBACK
        ========================================================= */

        async function handleSpotifyCallback() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const code =
                params.get("code");

            const state =
                params.get("state");

            const error =
                params.get("error");

            if (error) {

                showStatus(
                    "❌ Autorização cancelada."
                );

                return;
            }

            if (!code) {

                loadDashboard();

                return;
            }

            const savedState =
                localStorage.getItem(
                    "sp_state"
                );

            if (state !== savedState) {

                showStatus(
                    "❌ Erro de segurança no login."
                );

                return;
            }

            const verifier =
                localStorage.getItem(
                    "sp_verifier"
                );

            try {

                const response =
                    await fetch(
                        "https://accounts.spotify.com/api/token", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/x-www-form-urlencoded"
                            },

                            body: new URLSearchParams({

                                client_id: SPOTIFY_CLIENT_ID,

                                grant_type: "authorization_code",

                                code: code,

                                redirect_uri: SPOTIFY_REDIRECT_URI,

                                code_verifier: verifier

                            })

                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {

                    console.error(data);

                    showStatus(
                        "❌ Erro ao obter token."
                    );

                    return;
                }

                saveTokens(data);

                localStorage.removeItem(
                    "sp_verifier"
                );

                localStorage.removeItem(
                    "sp_state"
                );

                window.history.replaceState({},
                    document.title,
                    window.location.pathname
                );

                loadDashboard();

            } catch (error) {

                console.error(error);

                showStatus(
                    "❌ Erro de conexão."
                );

            }
        }


        /* =========================================================
           TOKENS
        ========================================================= */

        function saveTokens(data) {

            localStorage.setItem(
                "sp_access_token",
                data.access_token
            );

            localStorage.setItem(
                "sp_expires_at",
                Date.now() +
                data.expires_in * 1000
            );

            if (data.refresh_token) {

                localStorage.setItem(
                    "sp_refresh_token",
                    data.refresh_token
                );

            }
        }


        async function refreshSpotifyToken() {

            const refreshToken =
                localStorage.getItem(
                    "sp_refresh_token"
                );

            if (!refreshToken)
                return false;

            try {

                const response =
                    await fetch(
                        "https://accounts.spotify.com/api/token", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/x-www-form-urlencoded"
                            },

                            body: new URLSearchParams({

                                client_id: SPOTIFY_CLIENT_ID,

                                grant_type: "refresh_token",

                                refresh_token: refreshToken

                            })

                        }
                    );

                const data =
                    await response.json();

                if (!response.ok)
                    return false;

                saveTokens(data);

                return true;

            } catch {

                return false;

            }
        }


        async function getToken() {

            let token =
                localStorage.getItem(
                    "sp_access_token"
                );

            const expires =
                Number(
                    localStorage.getItem(
                        "sp_expires_at"
                    )
                );

            if (
                !token ||
                Date.now() > expires - 60000
            ) {

                const refreshed =
                    await refreshSpotifyToken();

                if (!refreshed)
                    return null;

                token =
                    localStorage.getItem(
                        "sp_access_token"
                    );
            }

            return token;
        }


        /* =========================================================
           API
        ========================================================= */

        async function spotifyAPI(
            endpoint,
            options = {}
        ) {

            const token =
                await getToken();

            if (!token)
                return null;

            const response =
                await fetch(
                    "https://api.spotify.com/v1" +
                    endpoint, {

                        ...options,

                        headers: {

                            ...(options.headers || {}),

                            Authorization: "Bearer " + token

                        }

                    }
                );

            if (response.status === 401) {

                const refreshed =
                    await refreshSpotifyToken();

                if (!refreshed)
                    return null;

                return spotifyAPI(
                    endpoint,
                    options
                );
            }

            /*
               CORREÇÃO CRÍTICA (rodada 9):

               Antes, o código tentava
               response.json() em TODA resposta,
               mas os endpoints PUT (shuffle,
               seek) retornam "204 No Content"
               — corpo VAZIO — e JSON.parse de
               string vazia dispara:
               "Unexpected token ... is not valid JSON"

               Esse erro derrubava o seek e o
               toggle de shuffle sem nenhuma
               mensagem clara no console.

               Agora: lê o corpo como texto e só
               faz parse quando houver conteúdo.
            */

            if (!response.ok) {

                console.error(
                    "Spotify API:",
                    response.status,
                    response.statusText
                );

                return null;
            }


            const body =
                await response.text();


            /*
               Corpo vazio (204 ou similar) =
               comando executado com sucesso,
               sem dados para devolver.
            */

            if (!body || !body.trim())
                return {};


            try {

                return JSON.parse(body);

            } catch {

                /*
                   Corpo não é JSON válido
                   (ex.: HTML de erro) —
                   trata como sucesso vazio,
                   mas registra para
                   diagnóstico.
                */

                console.log(
                    "Spotify API: resposta não-JSON",
                    "| status:",
                    response.status,
                    "| início do corpo:",
                    body.slice(0, 40)
                );

                return {};

            }

        }


        /* =========================================================
           PUT COM CORPO JSON (ANTIDOTO DO PROXY DO AVA)
        ========================================================= */

        /*
           DESCOBERTA (rodadas 10-14, logs do usuário):

           O ambiente do AVA intercepta as chamadas
           do navegador para api.spotify.com:
           - GET  → funciona (proxy do AVA replica);
           - PUT  → engolido (200 falso, o comando
                    nunca chega);
           - POST com override → bloqueado por CORS.

           ROTAS TENTADAS PELO spotifyPUT (nesta ordem):
           1. spotify_proxy.php (proxy PHP no mesmo
              servidor — só se o usuário/admin
              instalar o arquivo);
           2. PUT direto na API do Spotify — se o
              proxy devolver 404 (não instalado).
              Pode ser engolido pelo AVA, mas o
              código registra corretamente em vez
              de confundir 404 com sucesso.
        */

        async function spotifyPUT(
            endpoint,
            body = {}
        ) {

            const token =
                await getToken();

            if (!token)
                return null;

            /*
               ROTA PRINCIPAL: proxy local
               spotify_proxy.php (mesmo servidor).
               O proxy faz o PUT real ao Spotify
               pelo servidor (curl), sem CORS e
               sem a interferência do AVA.
            */

            let response;

            let route = "";


            /*
               ROTA 1: proxy PHP local (spotify_proxy.
               php no mesmo servidor). Só funciona se
               o arquivo foi instalado — se devolver
               404, cai para a rota 2.
            */

            const proxyUrl =
                "spotify_proxy.php?e=" +
                encodeURIComponent(endpoint);

            try {

                response =
                    await fetch(proxyUrl, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "X-Spotify-Token": "Bearer " + token,
                            "X-Spotify-Method": "PUT"
                        },

                        body: JSON.stringify(body)

                    });

                route = "proxy";

            } catch {

                response = null;

            }


            /*
               ROTA 2: PUT direto na API do Spotify.
               Ativa quando o proxy devolve 404
               (arquivo não instalado).
            */

            if (
                response === null ||
                response.status === 404
            ) {

                response =
                    await fetch(
                        "https://api.spotify.com/v1" +
                        endpoint, {

                            method: "PUT",

                            headers: {
                                Authorization: "Bearer " + token,
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(body)

                        }
                    );

                route = "direto";

            }


            if (response.status === 401) {

                const refreshed =
                    await refreshSpotifyToken();

                if (!refreshed)
                    return null;

                return spotifyPUT(
                    endpoint,
                    body
                );
            }


            if (!response.ok) {

                console.error(
                    "SPOTIFY PUT:",
                    "[" + route + "]",
                    response.status,
                    response.statusText,
                    "|",
                    await response.text()
                );

                return null;
            }


            const text =
                await response.text();


            /*
               Sucesso real do Spotify: 204 (sem corpo)
               ou JSON válido. Na rota direta, corpo
               estranho (token base64 do AVA) significa
               que o proxy do AVA engoliu o PUT —
               retorna null para o comando NÃO ser
               dado como enviado.
            */

            if (!text || !text.trim())
                return {};


            try {

                JSON.parse(text);

                console.log(
                    "SPOTIFY PUT: comando entregue",
                    "[" + route + "]"
                );

                return {};

            } catch {

                console.error(
                    "SPOTIFY PUT: resposta estranha",
                    "[" + route + "]",
                    "(proxy do AVA engoliu o PUT)",
                    "| status:",
                    response.status,
                    "| corpo:",
                    text.slice(0, 40)
                );

                return null;

            }

        }


        /* =========================================================
           WEB PLAYBACK SDK
        ========================================================= */

        window.onSpotifyWebPlaybackSDKReady =
            async function() {

                const token =
                    await getToken();

                if (!token)
                    return;

                if (spotifyPlayer)
                    return;

                spotifyPlayer =
                    new Spotify.Player({

                        name: "AVA Spotify Player",

                        getOAuthToken: callback => {

                            getToken()
                                .then(token => {

                                    if (token)
                                        callback(token);

                                });

                        },

                        volume: 0.7

                    });


                /* PLAYER PRONTO */

                spotifyPlayer.addListener(
                    "ready",
                    async ({
                        device_id
                    }) => {

                        console.log(
                            "PLAYER AVA PRONTO (v15):",
                            device_id
                        );

                        spotifyDeviceId =
                            device_id;

                        document.getElementById(
                                "sp-device"
                            ).innerHTML =
                            "● AVA Player conectado";

                        /*
                           NÃO inicia reprodução aqui.

                           Isso é importante.

                           Antes o player era transferido
                           automaticamente e podia recuperar
                           o contexto anterior do Spotify.
                        */

                    }
                );


                spotifyPlayer.addListener(
                    "not_ready",
                    ({
                        device_id
                    }) => {

                        console.log(
                            "PLAYER OFFLINE:",
                            device_id
                        );

                        spotifyDeviceId = null;

                    }
                );


                spotifyPlayer.addListener(
                    "player_state_changed",
                    state => {

                        if (!state)
                            return;


                        /*
                           Guarda o estado mais recente
                           do player para consultas
                           internas (ex.: seek).
                        */

                        spotifyPlayer._state = state;


                        updatePlayerState(state);

                    }
                );


                spotifyPlayer.addListener(
                    "initialization_error",
                    ({
                        message
                    }) => {

                        console.error(
                            "SDK INIT:",
                            message
                        );

                    }
                );


                spotifyPlayer.addListener(
                    "authentication_error",
                    ({
                        message
                    }) => {

                        console.error(
                            "SDK AUTH:",
                            message
                        );

                    }
                );


                spotifyPlayer.addListener(
                    "account_error",
                    ({
                        message
                    }) => {

                        console.error(
                            "SDK ACCOUNT:",
                            message
                        );

                        document.getElementById(
                                "sp-device"
                            ).innerHTML =
                            "⚠ Spotify Premium necessário";

                    }
                );


                spotifyPlayer.addListener(
                    "playback_error",
                    ({
                        message
                    }) => {

                        console.error(
                            "SDK PLAYBACK:",
                            message
                        );

                    }
                );


                spotifyPlayer.addListener(
                    "autoplay_failed",
                    () => {

                        console.warn(
                            "Spotify bloqueou autoplay."
                        );

                    }
                );


                spotifyPlayer.connect();

            };


        /* =========================================================
           ATIVAR PLAYER
        ========================================================= */

        async function activateSpotifyPlayer() {

            if (!spotifyPlayer)
                return false;

            try {

                if (
                    spotifyPlayer.activateElement
                ) {

                    await spotifyPlayer.activateElement();

                }

                return true;

            } catch (error) {

                console.error(
                    "ACTIVATE PLAYER:",
                    error
                );

                return false;

            }
        }


        /* =========================================================
           TRANSFERIR PLAYER
        ========================================================= */

        async function ensureSpotifyDevice() {

            if (!spotifyDeviceId)
                return false;

            const token =
                await getToken();

            if (!token)
                return false;


            /*
               CORREÇÃO DA TRANSFERÊNCIA.

               Antes: o player era transferido UMA VEZ
               e nunca mais verificado (spotifyTransferDone).

               Se o usuário tinha aberto o app do Spotify
               em outro aparelho depois, os comandos de
               PLAY iam para um dispositivo que já não era
               o ativo — gerando comportamento estranho
               (várias músicas "pulando" na interface).

               Agora: verifica SEMPRE qual dispositivo
               está tocando e espera até o AVA ser o ativo.
            */

            try {

                const response =
                    await fetch(
                        "https://api.spotify.com/v1/me/player", {

                            method: "PUT",

                            headers: {

                                Authorization: "Bearer " + token,

                                "Content-Type": "application/json"

                            },

                            body: JSON.stringify({

                                device_ids: [
                                    spotifyDeviceId
                                ],

                                play: false

                            })

                        }
                    );

                if (
                    response.ok ||
                    response.status === 204
                ) {

                    /*
                       Tenta confirmar que o AVA virou
                       o dispositivo ativo, mas SEM
                       bloquear: se o poll falhar
                       (Spotify demora a reportar),
                       ainda assim seguimos com o PLAY.
                    */

                    const confirmed =
                        await waitForActiveDevice();

                    if (!confirmed) {

                        console.warn(
                            "TRANSFER: player não confirmou, seguimos mesmo assim."
                        );

                    }

                    return true;

                }

                console.error(
                    "TRANSFER:",
                    await response.text()
                );

                return false;

            } catch (error) {

                console.error(
                    "TRANSFER ERROR:",
                    error
                );

                return false;

            }
        }


        /*
           NOVO:
           Espera até o dispositivo do AVA aparecer como
           o dispositivo ATIVO em /me/player.

           Se em 6 segundos não ativar, desiste e avisa
           (para não mandar PLAY para o dispositivo
           errado).
        */

        async function waitForActiveDevice() {

            /*
               CORREÇÃO (rate limit 429):
               O poll a cada 500ms encher o Spotify de
               pedidos /me/player gerou 429 (rate limit)
               no seu console — o que atrapalhava a
               transferência do player.

               Agora consultamos só 2 vezes, com 1,5s
               de intervalo. Menos consultas, menos
               risco de rate limit.
            */

            const maxChecks = 2;

            const interval = 1500;

            let checks = 0;


            while (checks < maxChecks) {

                checks++;


                try {

                    const state =
                        await spotifyAPI(
                            "/me/player"
                        );


                    if (
                        state &&
                        state.device &&
                        state.device.id === spotifyDeviceId
                    ) {

                        return true;

                    }


                } catch (error) {

                    console.error(
                        "WAIT DEVICE:",
                        error
                    );

                }


                await wait(interval);

            }


            console.warn(
                "DEVICE AVA NÃO ATIVOU A TEMPO."
            );

            /*
               Não usamos alert aqui: o Spotify às vezes
               demora alguns segundos a mais para
               reportar o dispositivo ativo, mas o PLAY
               ainda funciona. Não travamos o usuário.
            */

            return false;

        }


        /* =========================================================
           FORMATA TEMPO (ms → 3:45)
        ========================================================= */

        function formatTime(ms) {

            if (
                !ms ||
                isNaN(ms)
            )
                return "--:--";


            const total =
                Math.floor(ms / 1000);

            const minutes =
                Math.floor(total / 60);

            const seconds =
                total % 60;

            return minutes +
                ":" +
                (seconds < 10 ? "0" : "") +
                seconds;

        }


        /* =========================================================
           BARRA DE PROGRESSO (CLICÁVEL)
        ========================================================= */

        async function seekToPosition(
            event
        ) {

            if (
                !spotifyPlayer ||
                !spotifyDeviceId
            )
                return;

            if (spotifyCommandRunning)
                return;


            const bar =
                document.getElementById(
                    "sp-progress-bar"
                );

            if (!bar)
                return;


            const rect =
                bar.getBoundingClientRect();

            const percent =
                Math.min(
                    1,
                    Math.max(
                        0,
                        (event.clientX - rect.left) /
                        rect.width
                    )
                );


            /*
               Log para diagnóstico:
               se o seek ainda pular para o início,
               abra o console (F12) e veja a linha
               "SEEK:" para conferir o percent.
            */

            console.log(
                "SEEK: percent",
                Math.round(percent * 100) + "%"
            );


            spotifyCommandRunning = true;

            try {

                /*
                   DESCOBERTA (rodada 13): o AVA
                   intercepta o fetch para
                   api.spotify.com (PUT engolido).
                   MAS o Web Playback SDK usa um
                   canal WebSocket PRÓPRIO, que o
                   AVA NÃO intercepta — e por ele
                   a música toca.

                   CONFIRMADO NA DOC DO SDK:
                   player.seek(ms), pause, resume,
                   togglePlay, next/previousTrack e
                   setVolume são métodos REAIS do
                   SDK (canal WebSocket). JÁ
                   shuffle/repeat NÃO existem no SDK
                   — só pela Web API.

                   ESTRATÉGIA (v14):
                   - seek: 100% SDK (funciona).
                   - shuffle: tenta pela Web API;
                     se o AVA engolir o PUT, avisa
                     no log (o botão só atualiza
                     com confirmação real via GET).

                   seek(ms) recebe 0 a 1000.
                */

                const seekMs =
                    Math.round(
                        percent *
                        1000
                    );


                /*
                   1. Estado atual (shuffle e pausa)
                      via estado do SDK — sem API.
                */

                const sdkState =
                    spotifyPlayer._state || {};

                const shuffleWasOn =
                    sdkState.shuffle === true;

                const wasPlaying =
                    sdkState.paused !== true;

                console.log(
                    "SEEK [1/4]: estado do SDK",
                    "| shuffle:",
                    shuffleWasOn ? "SIM" : "não",
                    "| tocando:",
                    wasPlaying ? "sim" : "não"
                );


                /*
                   2. O SDK NÃO tem método de
                      shuffle (só seek/play/volume)
                      e o AVA engole os PUTs da Web
                      API — ou seja: com o shuffle
                      LIGADO não temos como desligá-
                      lo pelo AVA, e seek com shuffle
                      ligado TROCA de música.

                      Se o shuffle estava ligado:
                      avisamos e seguimos (a música
                      pode trocar); se estava
                      desligado, o seek vai para o
                      ponto exato clicado.
                */

                if (shuffleWasOn) {

                    console.warn(
                        "SEEK [2/4]: shuffle LIGADO",
                        "(não consigo desligar daqui)",
                        "→ o seek pode trocar de música;",
                        "desative o aleatório pelo app",
                        "ou pelo botão ↻ do player"
                    );

                }


                /*
                   3. Aplica o seek pelo SDK (canal
                      WebSocket, o AVA não intercepta).
                      Com shuffle desligado, pula para
                      o ponto exato clicado.
                */

                if (wasPlaying) {

                    await spotifyPlayer.pause();

                    await wait(300);

                }


                await spotifyPlayer.seek(seekMs);

        /* =========================================================
           TOCAR UMA MÚSICA ESPECÍFICA
           CORREÇÃO PRINCIPAL
        ========================================================= */

        /*
           CORREÇÃO:
           Agora o play usa o URI da música e a posição
           REAL na fila (contando só tracks), em vez de
           confiar no index visual da lista carregada.
        */

        /*
           NOVO:
           Busca a posição REAL de uma música dentro de
           uma lista de itens já carregada.

           Sintetiza a lista do Spotify pulando itens
           inválidos (episódios, podcasts, músicas
           removidas), exatamente como o SDK faz.
        */

        function findTrackPositionInList(
            items,
            trackUri
        ) {

            let realIndex = 0;

            for (
                let i = 0;
                i < items.length;
                i++
            ) {

                const item =
                    items[i];

                if (!item || !item.track)
                    continue;


                /*
                   SÓ contamos itens de tipo "track".
                   Episódios e podcasts não entram na
                   fila de reprodução musical.
                */

                if (item.track.type !== "track")
                    continue;


                if (item.track.uri === trackUri)
                    return realIndex;


                realIndex++;

            }


            return -1;

        }


        async function playPlaylistTrack(
            playlistId,
            trackUri,
            trackIndex
        ) {

            if (
                !spotifyPlayer ||
                !spotifyDeviceId
            ) {

                alert(
                    "O player do AVA ainda não está conectado ao Spotify."
                );

                return;

            }


            /*
               O trackUri vem DIRETO do clique na música.
               Não dependemos mais de buscas na API,
               que podiam falhar e gerar o alert de
               "não localizei a música".
            */

            if (!trackUri) {

                console.error(
                    "PLAY TRACK: URI ausente para o índice",
                    trackIndex
                );

                return;

            }


            if (spotifyCommandRunning)
                return;


            spotifyCommandRunning = true;


            /*
               Tenta descobrir a posição REAL da música
               na fila (contando só tracks), para manter
               a fila da playlist correta depois dela.

               Se falhar (playlist muito longa, API lenta),
               usamos apenas o URI — o Spotify ainda toca
               a música exata.
            */

            let realPosition = -1;

            try {

                const data =
                    await spotifyAPI(
                        "/playlists/" +
                        encodeURIComponent(
                            playlistId
                        ) +
                        "/items?limit=100"
                    );

                if (data && data.items) {

                    realPosition =
                        findTrackPositionInList(
                            data.items,
                            trackUri
                        );

                }

            } catch (error) {

                console.error(
                    "RESOLVE POSIÇÃO:",
                    error
                );

            }


            try {

                /*
                   MUITO IMPORTANTE:

                   Ativa o player através do clique
                   do usuário.
                */

                await activateSpotifyPlayer();


                /*
                   Garante que o dispositivo do AVA
                   seja o destino.
                */

                const transferred =
                    await ensureSpotifyDevice();

                if (!transferred) {

                    alert(
                        "Não consegui conectar o player do AVA ao Spotify."
                    );

                    return;

                }


                const token =
                    await getToken();

                if (!token)
                    return;


                /*
                   CORREÇÃO DA REPRODUÇÃO.

                   A causa do bug de "várias músicas
                   aparecendo de uma vez" era o uso de

                   offset: { position: trackIndex }

                   O index visual da lista não é a
                   posição real na fila do Spotify
                   (episódios pulados, playlists com
                   mais de 50 músicas, músicas repetidas).

                   Solução oficial do Spotify:

                   offset: { uri: "spotify:track:..." }

                   Assim o Spotify começa a tocar a
                   música EXATA e continua pela playlist.
                */

                /*
                   Sempre enviamos o URI da música clicada.
                   Se achamos a posição real na fila,
                   tocamos no contexto da playlist
                   (a fila continua normalmente).

                   Se não achamos a posição,
                   tocamos SOMENTE a música pelo URI
                   (sem alert, sem erro).
                */

                let requestBody = null;

                if (realPosition >= 0) {

                    requestBody = {

                        context_uri: "spotify:playlist:" +
                            playlistId,

                        offset: {
                            uri: trackUri
                        },

                        position_ms: 0

                    };

                } else {

                    requestBody = {

                        uris: [trackUri],

                        position_ms: 0

                    };

                }


                const response =
                    await fetch(
                        "https://api.spotify.com/v1/me/player/play?device_id=" +
                        encodeURIComponent(
                            spotifyDeviceId
                        ), {

                            method: "PUT",

                            headers: {

                                Authorization: "Bearer " + token,

                                "Content-Type": "application/json"

                            },

                            body: JSON.stringify(requestBody)

                        }
                    );


                if (
                    !response.ok &&
                    response.status !== 204
                ) {

                    const error =
                        await response.text();

                    console.error(
                        "ERRO AO TOCAR:",
                        error
                    );

                    alert(
                        "O Spotify recusou a reprodução.\n\n" +
                        error
                    );

                    return;

                }


                /*
                   Atualiza a interface depois que
                   o comando realmente foi enviado.
                */

                setTimeout(
                    loadCurrentlyPlaying,
                    700
                );


            } catch (error) {

                console.error(
                    "PLAY TRACK:",
                    error
                );

            } finally {

                /*
                   Impede cliques repetidos de
                   dispararem vários PLAY.
                */

                setTimeout(
                    () => {
                        spotifyCommandRunning = false;
                    },
                    500
                );

            }

        }

                    );

                const token =
                    await getToken();

                if (!token)
                    return;


                /*
                   PRIMEIRO definimos o shuffle.

                   Isso é separado do PLAY porque
                   o endpoint oficial do Spotify possui
                   uma operação própria para shuffle.
                */

                const shuffleResponse =
                    await fetch(

                        (shuffle ? "true" : "false") +

                        encodeURIComponent(

                            headers: {

                            }

                    );


                if (
                    !shuffleResponse.ok &&
                    shuffleResponse.status !== 204
                ) {

                    console.error(
                        "SHUFFLE:",
                        await shuffleResponse.text()
                    );

                }


                /*
                   Agora SIM iniciamos a playlist.

                   Sem array de URIs.
                   Sem fila manual.
                   Sem várias músicas.

                   Apenas UM contexto.
                */

                const response =
                    await fetch(
                        "https://api.spotify.com/v1/me/player/play?device_id=" +
                        encodeURIComponent(
                            spotifyDeviceId
                        ), {

                            method: "PUT",

                            headers: {

                                Authorization: "Bearer " + token,

                                "Content-Type": "application/json"

                            },

                            body: JSON.stringify({

                                context_uri: "spotify:playlist:" +
                                    playlistId

                            })

                        }
                    );


                if (
                    !response.ok &&
                    response.status !== 204
                ) {

                    const error =
                        await response.text();

                    console.error(
                        "PLAYLIST PLAY:",
                        error
                    );

                    alert(
                        "Erro ao iniciar playlist.\n\n" +
                        error
                    );

                    return;

                }


                setTimeout(
                    loadCurrentlyPlaying,

                );


            } catch (error) {

                console.error(
                    "PLAYLIST:",
                    error
                );

            } finally {

                setTimeout(
                    () => {

                        spotifyCommandRunning =
                            false;

                    },
                    700
                );

            }

        }

        /* =========================================================

        ========================================================= */

        async function toggleShuffle() {

            if (
                !spotifyPlayer ||
                !spotifyDeviceId
            )
                return;

            if (spotifyCommandRunning)
                return;


            const state =
                await spotifyAPI(
                    "/me/player"
                );

            if (!state) {

                console.error(
                    "SHUFFLE [1/3]: não foi possível ler o estado do player"
                );

                return;

            }

            /*
               VERSÃO 14: o SDK NÃO tem método de
               shuffle (confirmado na doc oficial) —
               o comando é só pela Web API. O AVA
               engole os PUTs (proxy), então o botão
               SÓ atualiza com confirmação REAL via
               GET (/me/player). Sem achismo.
            */

            const newState = !state.shuffle;

            console.log(
                "SHUFFLE [1/4]: estado atual",
                state.shuffle === true ? "ATIVADO" : "desativado",
                "| novo será:",
                newState ? "ATIVADO" : "desativado"
            );

            try {

                /*
                   2. Envia o comando pela Web API.
                      Se o AVA engolir o PUT, o
                      spotifyPUT devolve null.
                */

                const response =
                    await spotifyPUT(
                        "/me/player/shuffle?state=" +
                        (newState ? "true" : "false") +
                        "&device_id=" +
                        encodeURIComponent(
                            spotifyDeviceId
                        )
                    );

                if (response === null) {

                    console.error(
                        "SHUFFLE [2/4]: comando NÃO chegou ao Spotify",
                        "(proxy do AVA engoliu o PUT)",
                        "| tente de novo ou desative/ative",
                        "o aleatório pelo app do celular"
                    );

                    return;

                }

                console.log(
                    "SHUFFLE [2/4]: comando enviado",
                    newState ? "ATIVADO" : "desativado"
                );


                /*
                   3. CONFIRMAÇÃO: lê o estado real
                      na API (GET funciona) e só
                      atualiza o botão se o Spotify
                      realmente obedeceu.
                */

                await wait(500);

                const confirmed =
                    await spotifyAPI(
                        "/me/player"
                    );

                if (confirmed) {

                    const realState =
                        !!confirmed.shuffle;

                    updateShuffleButton(realState);

                    console.log(
                        "SHUFFLE [3/4]: confirmado na API",
                        realState ? "ATIVADO" : "desativado",
                        "| botão atualizado",
                        realState === newState ? "✓ igual ao esperado" : "⚠ diferente (o Spotify não obedeceu)"
                    );

                    /*
                       4. Se o Spotify não obedeceu
                          (ex.: fila de rádio), tenta
                          mais uma vez.
                    */

                    if (realState !== newState) {

                        await wait(500);

                        await spotifyPUT(
                            "/me/player/shuffle?state=" +
                            (newState ? "true" : "false") +
                            "&device_id=" +
                            encodeURIComponent(
                                spotifyDeviceId
                            )
                        );

                        await wait(500);

                        const confirmed2 =
                            await spotifyAPI(
                                "/me/player"
                            );

                        if (confirmed2) {

                            updateShuffleButton(
                                !!confirmed2.shuffle
                            );

                            console.log(
                                "SHUFFLE [4/4]: segunda tentativa",
                                !!confirmed2.shuffle ? "ATIVADO" : "desativado"
                            );

                        }

                    }

                } else {

                    console.error(
                        "SHUFFLE [3/4]: não consegui confirmar na API"
                    );

                }


            } catch (error) {

                console.error(
                    error
                );

            }

        }

                '">' +
                '🔀 Aleatório' +
                '</button>' +


                '<span style="' +
                'font-size:13px;' +
                'font-weight:bold;' +
                'color:#eee;' +
                'margin-left:4px;' +
                '">' +

                escapeHTML(
                    playlistName
                ) +

                '</span>';


            container.appendChild(
                header
            );


            /*
               Se o Spotify não devolver as músicas,
               ainda mostramos os botões de reprodução.
            */

            if (
                !data ||
                !data.items
            ) {

                const unavailable =
                    document.createElement(
                        "div"
                    );

                unavailable.style =
                    "grid-column:1/-1;" +
                    "padding:20px;" +
                    "text-align:center;" +
                    "color:#777;" +
                    "font-size:11px;";

                unavailable.innerHTML =
                    "As faixas desta playlist não podem ser exibidas pelo AVA.<br>" +
                    "Mas o Spotify ainda pode reproduzir a playlist pelo contexto.";

                container.appendChild(
                    unavailable
                );

                return;

            }


            if (data.items.length === 0) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.style =
                    "grid-column:1/-1;" +
                    "padding:20px;" +
                    "text-align:center;" +
                    "color:#777;" +
                    "font-size:11px;";

                empty.innerHTML =
                    "Nenhuma faixa disponível.";

                container.appendChild(
                    empty
                );

                return;

            }


            /* =====================================================
               FAIXAS
            ===================================================== */

            data.items.forEach(
                (item, index) => {

                    const track =
                        item.item;


                    if (!track)
                        return;


                    if (track.type !== "track")
                        return;


                    const image =
                        track.album &&
                        track.album.images &&
                        track.album.images.length

                        ?

                        track.album.images[
                            track.album.images.length - 1
                        ].url

                        :

                        "https://placehold.co/100x100/111/777?text=♫";


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.style =
                        "display:flex;" +
                        "align-items:center;" +
                        "gap:10px;" +
                        "padding:8px;" +
                        "background:#111;" +
                        "border:1px solid #222;" +
                        "border-radius:7px;" +
                        "cursor:pointer;" +
                        "transition:.2s;";


                    row.onmouseover =
                        function() {

                            this.style.borderColor =
                                "#1db954";

                            this.style.background =
                                "#181818";

                            this.style.transform =
                                "translateX(3px)";

                        };


                    row.onmouseout =
                        function() {

                            this.style.borderColor =
                                "#222";

                            this.style.background =
                                "#111";

                            this.style.transform =
                                "translateX(0)";

                        };


                    /*
                       CORREÇÃO DEFINITIVA:

                       Agora passamos o URI da música
                       DIRETO do clique, sem depender de
                       buscas na API.

                       O Spotify recebe:
                       "toque ESTA música dentro desta
                        playlist" — sem chance de erro
                        de posição.
                    */

                    row.onclick =
                        function() {

                            playPlaylistTrack(
                                playlistId,
                                track.uri,
                                index
                            );

                        };


                    row.innerHTML =

                        '<div style="' +
                        'width:20px;' +
                        'text-align:center;' +
                        'font-size:10px;' +
                        'color:#555;' +
                        '">' +

                        (index + 1) +

                        '</div>' +


                        '<img src="' +
                        image +
                        '" style="' +
                        'width:42px;' +
                        'height:42px;' +
                        'object-fit:cover;' +
                        'border-radius:5px;' +
                        '">' +


                        '<div style="' +
                        'flex:1;' +
                        'min-width:0;' +
                        '">' +


                        '<div style="' +
                        'font-size:12px;' +
                        'color:#eee;' +
                        'white-space:nowrap;' +
                        'overflow:hidden;' +
                        'text-overflow:ellipsis;' +
                        '">' +

                        escapeHTML(
                            track.name
                        ) +

                        '</div>' +


                        '<div style="' +
                        'font-size:10px;' +
                        'color:#777;' +
                        'white-space:nowrap;' +
                        'overflow:hidden;' +
                        'text-overflow:ellipsis;' +
                        '">' +

                        escapeHTML(
                            track.artists
                            .map(
                                a => a.name
                            )
                            .join(", ")
                        ) +

                        '</div>' +


                        '</div>';


                    container.appendChild(
                        row
                    );

                }
            );

        }


        /* =========================================================
           MÚSICA ATUAL
        ========================================================= */

        async function loadCurrentlyPlaying() {

            /*
               Se o SDK estiver funcionando,
               ele próprio fornece o estado.

               Não fazemos uma segunda consulta que
               possa competir com o SDK.
            */

            if (spotifyPlayer)
                return;


            const data =
                await spotifyAPI(
                    "/me/player"
                );


            if (
                !data ||
                !data.item
            )
                return;


            const track =
                data.item;


            document.getElementById(
                    "sp-track"
                ).innerHTML =
                escapeHTML(
                    track.name
                );


            document.getElementById(
                    "sp-artist"
                ).innerHTML =
                escapeHTML(
                    track.artists
                    .map(
                        a => a.name
                    )
                    .join(", ")
                );


            document.getElementById(
                    "sp-album"
                ).innerHTML =
                escapeHTML(
                    track.album ?
                    track.album.name :
                    ""
                );


            if (
                track.album &&
                track.album.images &&
                track.album.images.length
            ) {

                document.getElementById(
                        "sp-cover"
                    ).src =
                    track.album.images[
                        track.album.images.length - 1
                    ].url;

            }

        }


        /* =========================================================
           SEGURANÇA
        ========================================================= */

        function escapeHTML(text) {

            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "'");

        }


        function escapeJS(text) {

            return String(text || "")
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"');

        }


        /* =========================================================
           STATUS
        ========================================================= */

        function showStatus(text) {

            const status =
                document.getElementById(
                    "sp-status"
                );

            if (status)
                status.innerHTML =
                text;

        }


        /* =========================================================
           PERFIL
        ========================================================= */

        async function loadProfile() {

            const user =
                await spotifyAPI(
                    "/me"
                );

            if (!user)
                return;


            document.getElementById(
                    "sp-user"
                ).innerHTML =
                "🎵 " +
                escapeHTML(
                    user.display_name ||
                    "Spotify"
                );

        }


        /* =========================================================
           DASHBOARD
        ========================================================= */

        async function loadDashboard() {

            const token =
                await getToken();


            const login =
                document.getElementById(
                    "sp-login"
                );


            const dashboard =
                document.getElementById(
                    "sp-dashboard"
                );


            if (!token) {

                login.style.display =
                    "block";

                dashboard.style.display =
                    "none";

                return;

            }


            login.style.display =
                "none";

            dashboard.style.display =
                "block";


            await loadProfile();

            await loadCurrentlyPlaying();

            await loadPlaylists();

        }


        /* =========================================================
           INICIALIZAÇÃO
        ========================================================= */

        handleSpotifyCallback();
    </script>
