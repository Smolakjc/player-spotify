<div style="width: 100%; max-width: 850px; margin: 20px auto; padding: 10px; background: rgb(8, 8, 8); border: 1px solid rgb(48, 48, 48); border-radius: 14px; box-shadow: rgba(0, 0, 0, 0.65) 0px 10px 35px; font-family: Arial, Helvetica, sans-serif; color: rgb(238, 238, 238); box-sizing: border-box; --darkreader-inline-bgimage: initial; --darkreader-inline-bgcolor: var(--darkreader-background-080808, #060707); --darkreader-inline-border-top: var(--darkreader-border-303030, #7c7366); --darkreader-inline-border-right: var(--darkreader-border-303030, #7c7366); --darkreader-inline-border-bottom: var(--darkreader-border-303030, #7c7366); --darkreader-inline-border-left: var(--darkreader-border-303030, #7c7366); --darkreader-inline-boxshadow: var(--darkreader-background-000000a6, rgba(0, 0, 0, 0.65)) 0px 10px 35px; --darkreader-inline-color: var(--darkreader-text-eeeeee, #dddad6);" data-darkreader-inline-bgimage="" data-darkreader-inline-bgcolor="" data-darkreader-inline-border-top="" data-darkreader-inline-border-right="" data-darkreader-inline-border-bottom="" data-darkreader-inline-border-left="" data-darkreader-inline-boxshadow="" data-darkreader-inline-color="" bis_skin_checked="1">

    <script src="https://sdk.scdn.co/spotify-player.js"></script>

    <script>
        /* =========================================================
   CONFIGURAÇÃO
========================================================= */

        const SPOTIFY_CLIENT_ID = "4c24d375063546ef82113244a19777dc";

        const SPOTIFY_REDIRECT_URI =
            "https://smolakjc.github.io/player-spotify/";

        /*
           CORREÇÃO CRÍTICA:

           O scope "streaming" é OBRIGATÓRIO para o Web
           Playback SDK reproduzir áudio.

           Sem ele o SDK retorna "Invalid token scopes"
           (linha SDK AUTH do console) e os pedidos de
           licença do áudio dão 403 — a música toca por
           ~10 segundos e para.

           IMPORTANTE: mudar o scope aqui NÃO basta.
           Você PRECISA conectar novamente ao Spotify
           (clicar em CONECTAR AO SPOTIFY) para receber
           um token com os novos scopes.
        */

        const SPOTIFY_SCOPES =
            "streaming " +
            "user-read-private " +
            "user-read-email " +
            "user-read-currently-playing " +
            "user-read-playback-state " +
            "user-modify-playback-state " +
            "playlist-read-private " +
            "playlist-read-collaborative";


        /* =========================================================
           VARIÁVEIS
        ========================================================= */

        let spotifyPlayer = null;
        let spotifyDeviceId = null;

        let currentPlaylistId = null;
        let currentPlaylistName = null;

        let spotifyCommandRunning = false;


        /* =========================================================
           PKCE
        ========================================================= */

        function randomString(length) {

            const chars =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

            let result = "";

            for (let i = 0; i < length; i++) {

                result += chars.charAt(
                    Math.floor(Math.random() * chars.length)
                );

            }

            return result;
        }


        async function generateCodeChallenge(verifier) {

            const data =
                new TextEncoder().encode(verifier);

            const digest =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );

            return btoa(
                    String.fromCharCode(
                        ...new Uint8Array(digest)
                    )
                )
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/, "");
        }


        /* =========================================================
           LOGIN
        ========================================================= */

        async function spotifyLogin() {

            const verifier =
                randomString(128);

            const challenge =
                await generateCodeChallenge(verifier);

            const state =
                randomString(32);

            localStorage.setItem(
                "sp_verifier",
                verifier
            );

            localStorage.setItem(
                "sp_state",
                state
            );

            const params =
                new URLSearchParams({

                    client_id: SPOTIFY_CLIENT_ID,

                    response_type: "code",

                    redirect_uri: SPOTIFY_REDIRECT_URI,

                    scope: SPOTIFY_SCOPES,

                    state: state,

                    code_challenge_method: "S256",

                    code_challenge: challenge

                });

            const authUrl =
                "https://accounts.spotify.com/authorize?" +
                params.toString();


            /*
               RODADA FINAL: o Spotify proíbe (CSP
               frame-ancestors) que a página de login
               seja incorporada em iframe de outros
               domínios. Dentro de um iframe no
               Moodle, o redirecionamento da própria
               página carrega o login DENTRO do
               iframe → bloqueado.

               SOLUÇÃO: dentro de iframe, abrir a
               autorização numa NOVA janela que
               nunca é bloqueada por CSP; a própria
               página captura o código depois.
            */

            if (window.top !== window) {

                /*
                   RODADA FINAL: o Spotify proíbe
                   (CSP frame-ancestors) que a
                   página de login seja incorporada
                   em iframe de outros domínios.

                   SOLUÇÃO: dentro de iframe, abrir
                   a autorização numa NOVA janela
                   (nunca bloqueada por CSP).

                   Quando o Spotify redireciona de
                   volta, a URL da nova janela passa
                   a ser da NOSSA origem — aí dá
                   para ler o código (same-origin)
                   e processar o login aqui mesmo,
                   sem tocar na página do Moodle.
                */

                const popup = window.open(
                    authUrl,
                    "spotifyAuth",
                    "width=560,height=680,left=" +
                    ((window.screen.width - 560) / 2) +
                    ",top=" +
                    ((window.screen.height - 680) / 2)
                );

                if (!popup) {

                    showStatus(
                        "⚠ Pop-up bloqueado. Permita " +
                        "pop-ups para este site ou " +
                        "abra o player em nova aba."
                    );

                    return;

                }


                /*
                   GARDA: captura só UMA vez.
                   O poll roda a cada 800ms e o
                   evento focus também chama
                   tryCapture — sem a guarda, o
                   mesmo código gera 2 chamadas
                   do token e a 2ª retorna 400
                   "code already used".
                */

                let captured = false;

                const tryCapture = () => {

                    if (captured)
                        return false;

                    let popupUrl = "";

                    try {

                        /*
                           cross-origin enquanto a
                           janela está no Spotify;
                           readable só após o
                           redirect para nossa URL.
                        */

                        popupUrl =
                            popup.location.href;

                    } catch {

                        /* ainda no Spotify — ok */
                        return false;

                    }

                    if (
                        popupUrl.startsWith(
                            "https://smolakjc.github.io"
                        ) &&
                        popupUrl.includes("code=")
                    ) {

                        /*
                           Voltou para nosso player
                           com o código → captura a
                           busca inteira e processa
                           nesta página (mesmo
                           localStorage do iframe).
                        */

                        const search =
                            popupUrl.split("?")[1] ||
                            "";

                        if (
                            window.location.search !==
                            "?" + search
                        ) {

                            window.history.replaceState(
                                {},
                                "",
                                "?" + search
                            );

                        }

                        captured = true;

                        clearInterval(poll);

                        handleSpotifyCallback();

                        try {
                            popup.close();
                        } catch {}

                        return true;

                    }

                    return false;

                };


                /*
                   Tenta capturar: (a) quando a
                   janela focar, (b) periodicamente.
                */

                window.addEventListener(
                    "focus",
                    tryCapture
                );

                const poll = setInterval(() => {

                    if (tryCapture()) {

                        clearInterval(poll);

                    }

                    /*
                       janela fechada sem login:
                       para de monitorar depois de
                       5 minutos.
                    */

                }, 800);


                setTimeout(
                    () => clearInterval(poll),
                    5 * 60 * 1000
                );

                return;

            }


            /*
               Modo normal (player em aba própria):
               redireciona a própria página.
            */

            window.location.href = authUrl;
        }


        /* =========================================================
           CALLBACK
        ========================================================= */

        async function handleSpotifyCallback() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const code =
                params.get("code");

            const state =
                params.get("state");

            const error =
                params.get("error");

            if (error) {

                showStatus(
                    "❌ Autorização cancelada."
                );

                return;
            }

            if (!code) {

                loadDashboard();

                return;
            }

            const savedState =
                localStorage.getItem(
                    "sp_state"
                );

            if (state !== savedState) {

                showStatus(
                    "❌ Erro de segurança no login."
                );

                return;
            }

            const verifier =
                localStorage.getItem(
                    "sp_verifier"
                );

            try {

                const response =
                    await fetch(
                        "https://accounts.spotify.com/api/token", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/x-www-form-urlencoded"
                            },

                            body: new URLSearchParams({

                                client_id: SPOTIFY_CLIENT_ID,

                                grant_type: "authorization_code",

                                code: code,

                                redirect_uri: SPOTIFY_REDIRECT_URI,

                                code_verifier: verifier

                            })

                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {

                    console.error(data);

                    /*
                       CORRIGIDO (rodada final):
                       Dentro do iframe, o fluxo de
                       login usa popup. A captura do
                       código pode disparar 2 vezes
                       (evento focus + poll), e a
                       2ª tentativa do Spotify
                       retorna 400 "code already
                       used" — mas a 1ª já salvou
                       o token com sucesso.

                       Se já temos um access token
                       salvo, limpamos a URL e
                       seguimos normal em vez de
                       mostrar erro falso.
                    */

                    if (
                        localStorage.getItem(
                            "sp_access_token"
                        )
                    ) {

                        window.history.replaceState(
                            {},
                            "",
                            window.location.pathname
                        );

                        showStatus(
                            "✓ Login concluído."
                        );

                        loadDashboard();

                        return;
                    }

                    showStatus(
                        "❌ Erro ao obter token. " +
                        (data && data.error ?
                        "(" + data.error + ")" :
                        "") +
                        " Tente reconectar."
                    );

                    return;
                }

                saveTokens(data);

                localStorage.removeItem(
                    "sp_verifier"
                );

                localStorage.removeItem(
                    "sp_state"
                );

                window.history.replaceState({},
                    document.title,
                    window.location.pathname
                );

                loadDashboard();

            } catch (error) {

                console.error(error);

                showStatus(
                    "❌ Erro de conexão."
                );

            }
        }


        /* =========================================================
           TOKENS
        ========================================================= */

        function saveTokens(data) {

            localStorage.setItem(
                "sp_access_token",
                data.access_token
            );

            localStorage.setItem(
                "sp_expires_at",
                Date.now() +
                data.expires_in * 1000
            );

            if (data.refresh_token) {

                localStorage.setItem(
                    "sp_refresh_token",
                    data.refresh_token
                );

            }
        }


        async function refreshSpotifyToken() {

            const refreshToken =
                localStorage.getItem(
                    "sp_refresh_token"
                );

            if (!refreshToken)
                return false;

            try {

                const response =
                    await fetch(
                        "https://accounts.spotify.com/api/token", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/x-www-form-urlencoded"
                            },

                            body: new URLSearchParams({

                                client_id: SPOTIFY_CLIENT_ID,

                                grant_type: "refresh_token",

                                refresh_token: refreshToken

                            })

                        }
                    );

                const data =
                    await response.json();

                if (!response.ok)
                    return false;

                saveTokens(data);

                return true;

            } catch {

                return false;

            }
        }


        async function getToken() {

            let token =
                localStorage.getItem(
                    "sp_access_token"
                );

            const expires =
                Number(
                    localStorage.getItem(
                        "sp_expires_at"
                    )
                );

            if (
                !token ||
                Date.now() > expires - 60000
            ) {

                const refreshed =
                    await refreshSpotifyToken();

                if (!refreshed)
                    return null;

                token =
                    localStorage.getItem(
                        "sp_access_token"
                    );
            }

            return token;
        }


        /* =========================================================
           API
        ========================================================= */

        async function spotifyAPI(
            endpoint,
            options = {}
        ) {

            const token =
                await getToken();

            if (!token)
                return null;

            const response =
                await fetch(
                    "https://api.spotify.com/v1" +
                    endpoint, {

                        ...options,

                        headers: {

                            ...(options.headers || {}),

                            Authorization: "Bearer " + token

                        }

                    }
                );

            if (response.status === 401) {

                const refreshed =
                    await refreshSpotifyToken();

                if (!refreshed)
                    return null;

                return spotifyAPI(
                    endpoint,
                    options
                );
            }

            /*
               CORREÇÃO CRÍTICA (rodada 9):

               Antes, o código tentava
               response.json() em TODA resposta,
               mas os endpoints PUT (shuffle,
               seek) retornam "204 No Content"
               — corpo VAZIO — e JSON.parse de
               string vazia dispara:
               "Unexpected token ... is not valid JSON"

               Esse erro derrubava o seek e o
               toggle de shuffle sem nenhuma
               mensagem clara no console.

               Agora: lê o corpo como texto e só
               faz parse quando houver conteúdo.
            */

            if (!response.ok) {

                console.error(
                    "Spotify API:",
                    response.status,
                    response.statusText
                );

                return null;
            }


            const body =
                await response.text();


            /*
               Corpo vazio (204 ou similar) =
               comando executado com sucesso,
               sem dados para devolver.
            */

            if (!body || !body.trim())
                return {};


            try {

                return JSON.parse(body);

            } catch {

                /*
                   Corpo não é JSON válido
                   (ex.: HTML de erro) —
                   trata como sucesso vazio,
                   mas registra para
                   diagnóstico.
                */

                console.log(
                    "Spotify API: resposta não-JSON",
                    "| status:",
                    response.status,
                    "| início do corpo:",
                    body.slice(0, 40)
                );

                return {};

            }

        }


        /* =========================================================
           PUT DIRETO NA WEB API (RODA FORA DO AVA)
        ========================================================= */

        /*
           PUT DIRETO NA WEB API DO SPOTIFY.

           O player agora roda no GitHub Pages
           (fora do AVA) — então não há mais a
           interceptação que engolia os PUTs.

           (O proxy spotify_proxy.php foi removido:
           o GitHub Pages é estático e NÃO executa
           PHP — o arquivo era só para o AVA, onde
           o PUT direto era engolido. No GitHub
           Pages o PUT direto chega ao Spotify.)
        */

        async function spotifyPUT(
            endpoint,
            body = {}
        ) {

            const token =
                await getToken();

            if (!token)
                return null;

            const response =
                await fetch(
                    "https://api.spotify.com/v1" +
                    endpoint, {

                        method: "PUT",

                        headers: {
                            Authorization: "Bearer " + token,
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(body)

                    }
                );

            if (response.status === 401) {

                const refreshed =
                    await refreshSpotifyToken();

                if (!refreshed)
                    return null;

                return spotifyPUT(
                    endpoint,
                    body
                );
            }

            if (!response.ok) {

                console.error(
                    "SPOTIFY PUT:",
                    response.status,
                    response.statusText,
                    "|",
                    await response.text()
                );

                return null;
            }

            const text =
                await response.text();

            /*
               Sucesso real do Spotify: 204 (sem corpo)
               ou JSON válido. Corpo vazio = comando
               executado com sucesso.
            */

            if (!text || !text.trim())
                return {};

            try {

                JSON.parse(text);

            } catch {

                console.log(
                    "SPOTIFY PUT: resposta não-JSON",
                    "| status:",
                    response.status,
                    "| corpo:",
                    text.slice(0, 40)
                );

            }

            console.log(
                "SPOTIFY PUT: comando entregue ✓"
            );

            return {};

        }


        /* =========================================================
           WEB PLAYBACK SDK
        ========================================================= */

        window.onSpotifyWebPlaybackSDKReady =
            async function() {

                const token =
                    await getToken();

                if (!token)
                    return;

                if (spotifyPlayer)
                    return;

                spotifyPlayer =
                    new Spotify.Player({

                        name: "AVA Spotify Player",

                        getOAuthToken: callback => {

                            getToken()
                                .then(token => {

                                    if (token)
                                        callback(token);

                                });

                        },

                        volume: 0.7

                    });


                /* PLAYER PRONTO */

                spotifyPlayer.addListener(
                    "ready",
                    async ({
                        device_id
                    }) => {

                        console.log(
                            "PLAYER AVA PRONTO (v21):",
                            device_id
                        );

                        spotifyDeviceId =
                            device_id;

                        document.getElementById(
                                "sp-device"
                            ).innerHTML =
                            "● AVA Player conectado";

                        /*
                           NÃO inicia reprodução aqui.

                           Isso é importante.

                           Antes o player era transferido
                           automaticamente e podia recuperar
                           o contexto anterior do Spotify.
                        */

                    }
                );


                spotifyPlayer.addListener(
                    "not_ready",
                    ({
                        device_id
                    }) => {

                        console.log(
                            "PLAYER OFFLINE:",
                            device_id
                        );

                        spotifyDeviceId = null;

                    }
                );


                spotifyPlayer.addListener(
                    "player_state_changed",
                    state => {

                        if (!state)
                            return;


                        /*
                           Guarda o estado mais recente
                           do player para consultas
                           internas (ex.: seek).
                        */

                        spotifyPlayer._state = state;


                        updatePlayerState(state);

                    }
                );


                spotifyPlayer.addListener(
                    "initialization_error",
                    ({
                        message
                    }) => {

                        console.error(
                            "SDK INIT:",
                            message
                        );

                    }
                );


                spotifyPlayer.addListener(
                    "authentication_error",
                    ({
                        message
                    }) => {

                        console.error(
                            "SDK AUTH:",
                            message
                        );

                    }
                );


                spotifyPlayer.addListener(
                    "account_error",
                    ({
                        message
                    }) => {

                        console.error(
                            "SDK ACCOUNT:",
                            message
                        );

                        document.getElementById(
                                "sp-device"
                            ).innerHTML =
                            "⚠ Spotify Premium necessário";

                    }
                );


                spotifyPlayer.addListener(
                    "playback_error",
                    ({
                        message
                    }) => {

                        console.error(
                            "SDK PLAYBACK:",
                            message
                        );

                    }
                );


                spotifyPlayer.addListener(
                    "autoplay_failed",
                    () => {

                        console.warn(
                            "Spotify bloqueou autoplay."
                        );

                    }
                );


                spotifyPlayer.connect();

            };


        /* =========================================================
           ATIVAR PLAYER
        ========================================================= */

        async function activateSpotifyPlayer() {

            if (!spotifyPlayer)
                return false;

            try {

                if (
                    spotifyPlayer.activateElement
                ) {

                    await spotifyPlayer.activateElement();

                }

                return true;

            } catch (error) {

                console.error(
                    "ACTIVATE PLAYER:",
                    error
                );

                return false;

            }
        }


        /* =========================================================
           AGUARDAR PLAYER PRONTO (IFRAME)
        ========================================================= */

        /*
           RODADA FINAL:

           Dentro de um iframe (Moodle), o Spotify
           Web Playback SDK pode demorar a disparar
           "ready" — às vezes nem dispara até uma
           interação do usuário ou até o player ser
           reconectado.

           Antes, o alert "O player ainda não está
           conectado" aparecia SEMPRE que o
           device_id era nulo, mesmo quando o SDK
           estava a segundos de conectar.

           Agora: aguardamos o "ready" por até 10s
           antes de desistir; se o player ainda
           existe mas não conectou, forçamos
           reconexão (disconnect + connect).
        */

        async function waitUntilSpotifyReady() {

            if (spotifyPlayer && spotifyDeviceId)
                return true;

            if (!spotifyPlayer) {

                /*
                   SDK ainda não foi carregado
                   (página recém-conectada):
                   aguarda a função global de
                   criação ser chamada? Não dá para
                   injetar — só mostra mensagem.
                */

                return false;

            }


            /*
               1º tenta forçar a conexão
               (dentro de iframe o SDK às vezes
               precisa disso).
            */

            try {

                if (!spotifyPlayer.connect()) {

                    /*
                       connect() retorna false se já
                       conectado; tudo bem, segue.
                    */

                }

            } catch {}


            /*
               Aguarda o "ready" por até 10s
               (consulta a cada 400ms).
            */

            const deadline = Date.now() + 10000;

            while (Date.now() < deadline) {

                if (spotifyDeviceId)
                    return true;

                await new Promise(r =>
                    setTimeout(r, 400)
                );

            }


            /*
               Última tentativa: reconecta
               (disconnect + connect).
            */

            try {

                await spotifyPlayer.disconnect();

            } catch {}

            try {

                spotifyPlayer.connect();

            } catch {}

            for (let i = 0; i < 10; i++) {

                if (spotifyDeviceId)
                    return true;

                await new Promise(r =>
                    setTimeout(r, 400)
                );

            }

            return false;

        }


        /* =========================================================
           TRANSFERIR PLAYER
        ========================================================= */

        async function ensureSpotifyDevice() {

            if (!spotifyDeviceId)
                return false;

            const token =
                await getToken();

            if (!token)
                return false;


            /*
               CORREÇÃO DA TRANSFERÊNCIA.

               Antes: o player era transferido UMA VEZ
               e nunca mais verificado (spotifyTransferDone).

               Se o usuário tinha aberto o app do Spotify
               em outro aparelho depois, os comandos de
               PLAY iam para um dispositivo que já não era
               o ativo — gerando comportamento estranho
               (várias músicas "pulando" na interface).

               Agora: verifica SEMPRE qual dispositivo
               está tocando e espera até o AVA ser o ativo.
            */

            try {

                const response =
                    await fetch(
                        "https://api.spotify.com/v1/me/player", {

                            method: "PUT",

                            headers: {

                                Authorization: "Bearer " + token,

                                "Content-Type": "application/json"

                            },

                            body: JSON.stringify({

                                device_ids: [
                                    spotifyDeviceId
                                ],

                                play: false

                            })

                        }
                    );

                if (
                    response.ok ||
                    response.status === 204
                ) {

                    /*
                       Tenta confirmar que o AVA virou
                       o dispositivo ativo, mas SEM
                       bloquear: se o poll falhar
                       (Spotify demora a reportar),
                       ainda assim seguimos com o PLAY.
                    */

                    const confirmed =
                        await waitForActiveDevice();

                    if (!confirmed) {

                        console.warn(
                            "TRANSFER: player não confirmou, seguimos mesmo assim."
                        );

                    }

                    return true;

                }

                console.error(
                    "TRANSFER:",
                    await response.text()
                );

                return false;

            } catch (error) {

                console.error(
                    "TRANSFER ERROR:",
                    error
                );

                return false;

            }
        }


        /*
           NOVO:
           Espera até o dispositivo do AVA aparecer como
           o dispositivo ATIVO em /me/player.

           Se em 6 segundos não ativar, desiste e avisa
           (para não mandar PLAY para o dispositivo
           errado).
        */

        async function waitForActiveDevice() {

            /*
               CORREÇÃO (rate limit 429):
               O poll a cada 500ms encher o Spotify de
               pedidos /me/player gerou 429 (rate limit)
               no seu console — o que atrapalhava a
               transferência do player.

               Agora consultamos só 2 vezes, com 1,5s
               de intervalo. Menos consultas, menos
               risco de rate limit.
            */

            const maxChecks = 2;

            const interval = 1500;

            let checks = 0;


            while (checks < maxChecks) {

                checks++;


                try {

                    const state =
                        await spotifyAPI(
                            "/me/player"
                        );


                    if (
                        state &&
                        state.device &&
                        state.device.id === spotifyDeviceId
                    ) {

                        return true;

                    }


                } catch (error) {

                    console.error(
                        "WAIT DEVICE:",
                        error
                    );

                }


                await wait(interval);

            }


            console.warn(
                "DEVICE AVA NÃO ATIVOU A TEMPO."
            );

            /*
               Não usamos alert aqui: o Spotify às vezes
               demora alguns segundos a mais para
               reportar o dispositivo ativo, mas o PLAY
               ainda funciona. Não travamos o usuário.
            */

            return false;

        }


        /* =========================================================
           FORMATA TEMPO (ms → 3:45)
        ========================================================= */

        function formatTime(ms) {

            if (
                !ms ||
                isNaN(ms)
            )
                return "--:--";


            const total =
                Math.floor(ms / 1000);

            const minutes =
                Math.floor(total / 60);

            const seconds =
                total % 60;

            return minutes +
                ":" +
                (seconds < 10 ? "0" : "") +
                seconds;

        }


        /* =========================================================
           BARRA DE PROGRESSO (CLICÁVEL)
        ========================================================= */

        async function seekToPosition(
            event
        ) {

            if (!spotifyPlayer)
                return;

            if (
                !spotifyDeviceId &&
                !await waitUntilSpotifyReady()
            )
                return;

            if (spotifyCommandRunning)
                return;


            const bar =
                document.getElementById(
                    "sp-progress-bar"
                );

            if (!bar)
                return;


            const rect =
                bar.getBoundingClientRect();

            const percent =
                Math.min(
                    1,
                    Math.max(
                        0,
                        (event.clientX - rect.left) /
                        rect.width
                    )
                );


            /*
               Log para diagnóstico:
               se o seek ainda pular para o início,
               abra o console (F12) e veja a linha
               "SEEK:" para conferir o percent.
            */

            console.log(
                "SEEK: percent",
                Math.round(percent * 100) + "%"
            );


            spotifyCommandRunning = true;

            try {

                /*
                   DESCOBERTA (rodada 13): o AVA
                   intercepta o fetch para
                   api.spotify.com (PUT engolido).
                   MAS o Web Playback SDK usa um
                   canal WebSocket PRÓPRIO, que o
                   AVA NÃO intercepta — e por ele
                   a música toca.

                   CONFIRMADO NA DOC DO SDK:
                   player.seek(ms), pause, resume,
                   togglePlay, next/previousTrack e
                   setVolume são métodos REAIS do
                   SDK (canal WebSocket). JÁ
                   shuffle/repeat NÃO existem no SDK
                   — só pela Web API.

                   ESTRATÉGIA (v14):
                   - seek: 100% SDK (funciona).
                   - shuffle: tenta pela Web API;
                     se o AVA engolir o PUT, avisa
                     no log (o botão só atualiza
                     com confirmação real via GET).

                   seek(ms) recebe 0 a 1000.
                */

                /*
                   CORRIGIDO (v19):
                   Antes o código mandava
                   "percent * 1000" — ou seja,
                   NO MÁXIMO 1000ms (1s) de
                   qualquer música. Clicar na
                   metade de uma música de 4min
                   mandava 500ms = início.
                   Era ISSO que fazia a barra
                   "voltar pro começo".

                   Agora: usa a duração REAL do
                   estado do SDK (ms).
                */

                /*
                   1. Estado atual (shuffle, pausa e
                      duração) via estado do SDK —
                      sem API. A declaração vem
                      ANTES do cálculo do seek,
                      porque a duração real é usada
                      para converter o percent em ms.
                */

                const sdkState =
                    spotifyPlayer._state || {};

                const duration =
                    sdkState.duration || 0;

                const seekMs =
                    duration ?
                    Math.round(
                        percent * duration
                    ) :
                    Math.round(
                        percent * 1000
                    );

                const shuffleWasOn =
                    sdkState.shuffle === true;

                const wasPlaying =
                    sdkState.paused !== true;

                console.log(
                    "SEEK [1/4]: estado do SDK",
                    "| shuffle:",
                    shuffleWasOn ? "SIM" : "não",
                    "| tocando:",
                    wasPlaying ? "sim" : "não"
                );


                /*
                   2. O SDK NÃO tem método de
                      shuffle (só seek/play/volume)
                      e o AVA engole os PUTs da Web
                      API — ou seja: com o shuffle
                      LIGADO não temos como desligá-
                      lo pelo AVA, e seek com shuffle
                      ligado TROCA de música.

                      Se o shuffle estava ligado:
                      avisamos e seguimos (a música
                      pode trocar); se estava
                      desligado, o seek vai para o
                      ponto exato clicado.
                */

                if (shuffleWasOn) {

                    console.warn(
                        "SEEK [2/4]: shuffle LIGADO",
                        "(não consigo desligar daqui)",
                        "→ o seek pode trocar de música;",
                        "desative o aleatório pelo app",
                        "ou pelo botão ↻ do player"
                    );

                }


                /*
                   3. Aplica o seek pelo SDK (canal
                      WebSocket, o AVA não intercepta).
                      Com shuffle desligado, pula para
                      o ponto exato clicado.
                */

                if (wasPlaying) {

                    await spotifyPlayer.pause();

                    await wait(300);

                }


                await spotifyPlayer.seek(seekMs);

                console.log(
                    "SEEK [3/4]: comando de seek",
                    seekMs + "ms",
                    "enviado pelo SDK ✓"
                );


                /*
                   4. Volta a tocar da nova posição.
                */

                if (wasPlaying) {

                    await wait(300);

                    await spotifyPlayer.resume();

                }


                console.log(
                    "SEEK [4/4]: ok",
                    shuffleWasOn ?
                    "(shuffle ainda ligado — se a música trocou, desative o aleatório no app)" :
                    "(pulei para o ponto exato)"
                );


            } catch (error) {

                console.error(
                    "SEEK:",
                    error
                );

            } finally {

                setTimeout(
                    () => {
                        spotifyCommandRunning = false;
                    },
                    500
                );

            }

        }

        function stateOfPlayerPaused() {

            if (

                return spotifyPlayer._state.paused;

            return false;

        /* =========================================================
           ESTADO DO PLAYER
        ========================================================= */

        function updatePlayerState(state) {

            if (!state)
                return;

            const track =
                state.track_window &&
                state.track_window.current_track;

            if (!track)
                return;

            const trackElement =
                document.getElementById(
                    "sp-track"
                );

            const artistElement =
                document.getElementById(
                    "sp-artist"
                );

            const albumElement =
                document.getElementById(
                    "sp-album"
                );

            const coverElement =
                document.getElementById(
                    "sp-cover"
                );

            const progressElement =
                document.getElementById(
                    "sp-progress"
                );

            const currentTimeElement =
                document.getElementById(
                    "sp-current-time"
                );

            const totalTimeElement =
                document.getElementById(
                    "sp-total-time"
                );

            const playElement =
                document.getElementById(
                    "sp-play"
                );


            if (trackElement)
                trackElement.innerHTML =
                escapeHTML(track.name);


            if (artistElement)
                artistElement.innerHTML =
                escapeHTML(
                    track.artists
                    .map(a => a.name)
                    .join(", ")
                );


            if (albumElement)
                albumElement.innerHTML =
                escapeHTML(
                    track.album ?
                    track.album.name :
                    ""
                );


            if (
                coverElement &&
                track.album &&
                track.album.images &&
                track.album.images.length
            ) {

                coverElement.src =
                    track.album.images[
                        track.album.images.length - 1
                    ].url;

            }


            const percent =
                state.duration ?
                (
                    state.position /
                    state.duration
                ) * 100 :
                0;


            if (progressElement)
                progressElement.style.width =
                percent + "%";


            if (currentTimeElement)
                currentTimeElement.innerHTML =
                formatTime(
                    state.position
                );


            if (totalTimeElement)
                totalTimeElement.innerHTML =
                formatTime(
                    state.duration
                );


            if (playElement)
                playElement.innerHTML =
                state.paused ?
                "▶" :
                "❚❚";


            /*
               ALEATÓRIO: agora o botão tem um fundo
               verde claro quando está ATIVO, além da
               cor verde no ícone — fica impossível
               confundir o estado.

               O estado visual é lido DIRETAMENTE do
               player (state.shuffle), então o botão
               sempre reflete a realidade — inclusive
               se o shuffle foi ligado em outro
               dispositivo (celular, etc).
            */

            console.log(
                "SHUFFLE ESTADO:",
                state.shuffle === true ? "ATIVADO" : "desativado"
            );

            updateShuffleButton(
                !!state.shuffle
            );

        }


        /* =========================================================
           TOCAR UMA MÚSICA ESPECÍFICA
           CORREÇÃO PRINCIPAL
        ========================================================= */

        /*
           CORREÇÃO:
           Agora o play usa o URI da música e a posição
           REAL na fila (contando só tracks), em vez de
           confiar no index visual da lista carregada.
        */

        /*
           NOVO:
           Busca a posição REAL de uma música dentro de
           uma lista de itens já carregada.

           Sintetiza a lista do Spotify pulando itens
           inválidos (episódios, podcasts, músicas
           removidas), exatamente como o SDK faz.
        */

        function findTrackPositionInList(
            items,
            trackUri
        ) {

            let realIndex = 0;

            for (
                let i = 0;
                i < items.length;
                i++
            ) {

                const item =
                    items[i];

                if (!item || !item.track)
                    continue;


                /*
                   SÓ contamos itens de tipo "track".
                   Episódios e podcasts não entram na
                   fila de reprodução musical.
                */

                if (item.track.type !== "track")
                    continue;


                if (item.track.uri === trackUri)
                    return realIndex;


                realIndex++;

            }


            return -1;

        }


        async function playPlaylistTrack(
            playlistId,
            trackUri,
            trackIndex
        ) {

            if (!spotifyPlayer) {

                /*
                   NOVIDADE (v21.2):
                   Mensagem mais útil para quem usa
                   o player em OUTRO computador:

                   O Web Playback SDK cria um
                   "dispositivo" do Spotify EXCLUSIVO
                   daquele navegador. O player só
                   toca no computador onde o LOGIN
                   foi feito. Em outro PC, basta
                   fazer login ali de novo.
                */

                alert(
                    "O player do AVA ainda não está conectado ao Spotify.\n\n" +
                    "O player funciona SÓ no computador onde você fez o login do Spotify.\n\n" +
                    "Se você está em OUTRO computador (ou outro navegador), " +
                    "faça login no Spotify AQUI novamente — " +
                    "aparece a tela de conexão ao abrir o player.\n\n" +
                    "Se o player já está aberto, atualize a página (F5)."
                );

                return;

            }

            if (!spotifyDeviceId) {

                showStatus(
                    "⏳ Conectando ao Spotify..."
                );

                const ready =
                    await waitUntilSpotifyReady();

                if (!ready) {

                    alert(
                        "O player do AVA ainda não está conectado ao Spotify.\n\nDica: dentro do Moodle, o Spotify às vezes demora a ativar. Tente clicar de novo — se não funcionar, abra o player em uma aba nova."
                    );

                    return;

                }

            }


            /*
               O trackUri vem DIRETO do clique na música.
               Não dependemos mais de buscas na API,
               que podiam falhar e gerar o alert de
               "não localizei a música".
            */

            if (!trackUri) {

                console.error(
                    "PLAY TRACK: URI ausente para o índice",
                    trackIndex
                );

                return;

            }


            if (spotifyCommandRunning)
                return;


            spotifyCommandRunning = true;


            /*
               Tenta descobrir a posição REAL da música
               na fila (contando só tracks), para manter
               a fila da playlist correta depois dela.

               Se falhar (playlist muito longa, API lenta),
               usamos apenas o URI — o Spotify ainda toca
               a música exata.
            */

            let realPosition = -1;

            try {

                const data =
                    await spotifyAPI(
                        "/playlists/" +
                        encodeURIComponent(
                            playlistId
                        ) +
                        "/items?limit=100"
                    );

                if (data && data.items) {

                    realPosition =
                        findTrackPositionInList(
                            data.items,
                            trackUri
                        );

                }

            } catch (error) {

                console.error(
                    "RESOLVE POSIÇÃO:",
                    error
                );

            }


            try {

                /*
                   MUITO IMPORTANTE:

                   Ativa o player através do clique
                   do usuário.
                */

                await activateSpotifyPlayer();


                /*
                   Garante que o dispositivo do AVA
                   seja o destino.
                */

                const transferred =
                    await ensureSpotifyDevice();

                if (!transferred) {

                    alert(
                        "Não consegui conectar o player do AVA ao Spotify."
                    );

                    return;

                }


                const token =
                    await getToken();

                if (!token)
                    return;


                /*
                   CORREÇÃO DA REPRODUÇÃO.

                   A causa do bug de "várias músicas
                   aparecendo de uma vez" era o uso de

                   offset: { position: trackIndex }

                   O index visual da lista não é a
                   posição real na fila do Spotify
                   (episódios pulados, playlists com
                   mais de 50 músicas, músicas repetidas).

                   Solução oficial do Spotify:

                   offset: { uri: "spotify:track:..." }

                   Assim o Spotify começa a tocar a
                   música EXATA e continua pela playlist.
                */

                /*
                   Sempre enviamos o URI da música clicada.
                   Se achamos a posição real na fila,
                   tocamos no contexto da playlist
                   (a fila continua normalmente).

                   Se não achamos a posição,
                   tocamos SOMENTE a música pelo URI
                   (sem alert, sem erro).
                */

                let requestBody = null;

                if (realPosition >= 0) {

                    requestBody = {

                        context_uri: "spotify:playlist:" +
                            playlistId,

                        offset: {
                            uri: trackUri
                        },

                        position_ms: 0

                    };

                } else {

                    requestBody = {

                        uris: [trackUri],

                        position_ms: 0

                    };

                }


                const response =
                    await fetch(
                        "https://api.spotify.com/v1/me/player/play?device_id=" +
                        encodeURIComponent(
                            spotifyDeviceId
                        ), {

                            method: "PUT",

                            headers: {

                                Authorization: "Bearer " + token,

                                "Content-Type": "application/json"

                            },

                            body: JSON.stringify(requestBody)

                        }
                    );


                if (
                    !response.ok &&
                    response.status !== 204
                ) {

                    const error =
                        await response.text();

                    console.error(
                        "ERRO AO TOCAR:",
                        error
                    );

                    alert(
                        "O Spotify recusou a reprodução.\n\n" +
                        error
                    );

                    return;

                }


                /*
                   Atualiza a interface depois que
                   o comando realmente foi enviado.
                */

                setTimeout(
                    loadCurrentlyPlaying,
                    700
                );


            } catch (error) {

                console.error(
                    "PLAY TRACK:",
                    error
                );

            } finally {

                /*
                   Impede cliques repetidos de
                   dispararem vários PLAY.
                */

                setTimeout(
                    () => {
                        spotifyCommandRunning = false;
                    },
                    500
                );

            }

        }

                    "SHUFFLE [2/4]: comando enviado",
                    newState ? "ATIVADO" : "desativado"
                );


                /*
                   3. CONFIRMAÇÃO: lê o estado real
                      na API (GET funciona) e só
                      atualiza o botão se o Spotify
                      realmente obedeceu.
                */

                await wait(500);

                const confirmed =
                    await spotifyAPI(
                        "/me/player"
                    );

                if (confirmed) {

                    const realState =
                        !!confirmed.shuffle;

                    updateShuffleButton(realState);

                    console.log(
                        "SHUFFLE [3/4]: confirmado na API",
                        realState ? "ATIVADO" : "desativado",
                        "| botão atualizado",
                        realState === newState ? "✓ igual ao esperado" : "⚠ diferente (o Spotify não obedeceu)"
                    );

                    /*
                       4. Se o Spotify não obedeceu
                          (ex.: fila de rádio), tenta
                          mais uma vez.
                    */

                    if (realState !== newState) {

                        await wait(500);

                        await spotifyPUT(
                            "/me/player/shuffle?state=" +
                            (newState ? "true" : "false") +
                            "&device_id=" +
                            encodeURIComponent(
                                spotifyDeviceId
                            )
                        );

                        await wait(500);

                        const confirmed2 =
                            await spotifyAPI(
                                "/me/player"
                            );

                        if (confirmed2) {

                            updateShuffleButton(
                                !!confirmed2.shuffle
                            );

                            console.log(
                                "SHUFFLE [4/4]: segunda tentativa",
                                !!confirmed2.shuffle ? "ATIVADO" : "desativado"
                            );

                        }

                    }

                } else {

                    console.error(
                        "SHUFFLE [3/4]: não consegui confirmar na API"
                    );

                }


            } catch (error) {

                console.error(
                    error
                );

            }

        }

        /* =========================================================
           PESQUISA NO SPOTIFY (/v1/search)
        ========================================================= */

        /*
           NOVIDADE (v21):
           A Web API do Spotify tem endpoint de
           busca — /v1/search — que aceita token de
           usuário. Não ficamos mais presos só às
           playlists salvas: qualquer música, playlist
           ou artista do Spotify pode ser pesquisado.

           Tipo de resposta: "track" (música),
           "playlist" (playlist pública) e "artist"
           (artista, toca o top tracks dele).

           Debounce: só busca 350ms após o usuário
           parar de digitar (evita chamar a API a
           cada letra).
        */

        let searchTimer = null;

        async function searchTracks(query) {

            const container =
                document.getElementById(
                    "sp-search-results"
                );

            if (!container)
                return;

            clearTimeout(searchTimer);

            query = (query || "").trim();

            if (query.length < 3) {

                container.innerHTML = "";

                return;

            }


            searchTimer =
                setTimeout(
                    async () => {

                        container.innerHTML =
                            '<div style="grid-column:1/-1;text-align:center;padding:14px;color:#777;">Buscando...</div>';


                        const data =
                            await spotifyAPI(
                                "/search?q=" +
                                encodeURIComponent(
                                    query
                                ) +
                                "&type=track,playlist,artist" +
                                "&limit=6"
                            );


                        if (
                            !data ||
                            (
                                !data.tracks &&
                                !data.playlists &&
                                !data.artists
                            )
                        ) {

                            container.innerHTML =
                                '<div style="grid-column:1/-1;text-align:center;color:#777;">Nada encontrado.</div>';

                            return;

                        }


                        container.innerHTML = "";


                        const makeCard = (
                            image,
                            name,
                            subtitle,
                            typeLabel,
                            onClick
                        ) => {

                            const card =
                                document.createElement("div");

                            card.style =
                                "display:flex;align-items:center;" +
                                "gap:10px;padding:8px;" +
                                "background:#111;" +
                                "border:1px solid #222;" +
                                "border-radius:7px;" +
                                "cursor:pointer;transition:.2s;" +
                                "max-width:100%;";

                            card.onmouseover =
                                function() {

                                    this.style.borderColor = "#1db954";

                                    this.style.background = "#181818";

                                    this.style.transform = "translateY(-2px)";

                                };

                            card.onmouseout =
                                function() {

                                    this.style.borderColor = "#222";

                                    this.style.background = "#111";

                                    this.style.transform = "translateY(0)";

                                };

                            card.onclick = onClick;

                            card.innerHTML =
                                '<img src="' +
                                image +
                                '" style="width:45px;height:45px;object-fit:cover;border-radius:' +
                                (typeLabel === "ARTISTA" ? "23px" : "5px") +
                                ";flex-shrink:0;" +
                                '">' +
                                '<span style="font-size:11px;color:#ccc;"' +
                                ' title="' +
                                escapeHTML(name) +
                                '">' +
                                '<span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
                                escapeHTML(name) +
                                '</span>' +
                                '<span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#777;font-size:10px;">' +
                                escapeHTML(subtitle) +
                                '</span>' +
                                '<span style="display:inline-block;margin-top:3px;font-size:8px;letter-spacing:1px;padding:1px 5px;border:1px solid #444;border-radius:4px;color:#999;">' +
                                typeLabel +
                                '</span>' +
                                '</span>';

                            container.appendChild(card);

                        };


                        const tracks =
                            (data.tracks && data.tracks.items) || [];

                        const playlists =
                            (data.playlists && data.playlists.items) || [];

                        const artists =
                            (data.artists && data.artists.items) || [];


                        tracks.forEach(
                            track => {

                                const image =
                                    track.album &&
                                    track.album.images &&
                                    track.album.images.length

                                    ?

                                    track.album.images[0].url

                                    :

                                    "https://placehold.co/300x300/111/777?text=♫";


                                makeCard(
                                    image,
                                    track.name,
                                    track.artists
                                        .map(a => a.name)
                                        .join(", "),
                                    "MÚSICA",
                                    () =>
                                        playTrackByUri(
                                            track.uri,
                                            track.name +
                                            " — " +
                                            track.artists.map(a => a.name).join(", ")
                                        )
                                );

                            }
                        );


                        playlists.forEach(
                            playlist => {

                                if (
                                    !playlist ||
                                    !playlist.id
                                )
                                    return;


                                const image =
                                    playlist.images &&
                                    playlist.images.length

                                    ?

                                    playlist.images[0].url

                                    :

                                    "https://placehold.co/300x300/111/777?text=♫";


                                makeCard(
                                    image,
                                    playlist.name,
                                    (playlist.owner ?
                                    playlist.owner.display_name :
                                    "") +
                                    (playlist.tracks && playlist.tracks.total !== undefined ?
                                    " • " + playlist.tracks.total + " músicas" :
                                    ""),
                                    "PLAYLIST",
                                    () => {

                                        /*
                                           NOVIDADE (v21.1):
                                           Em vez de tocar a playlist
                                           direto, o clique abre a
                                           playlist com as faixas dela
                                           (igual às playlists salvas).
                                           Aí o usuário escolhe a faixa
                                           ou usa os botões ▶ / 🔀.
                                        */

                                        container.innerHTML = "";

                                        clearTimeout(
                                            searchTimer
                                        );

                                        const searchField =
                                            document.getElementById(
                                                "sp-search"
                                            );

                                        if (searchField)
                                            searchField.value = "";

                                        loadPlaylistTracks(
                                            playlist.id,
                                            playlist.name,
                                            playlist.uri
                                        );

                                    }
                                );

                            }
                        );


                        artists.forEach(
                            artist => {

                                if (
                                    !artist ||
                                    !artist.id
                                )
                                    return;


                                const image =
                                    artist.images &&
                                    artist.images.length

                                    ?

                                    artist.images[0].url

                                    :

                                    "https://placehold.co/300x300/111/777?text=♫";


                                makeCard(
                                    image,
                                    artist.name,
                                    (artist.genres && artist.genres.length ?
                                    artist.genres.slice(0, 3).join(", ") :
                                    ""),
                                    "ARTISTA",
                                    () =>
                                        playArtistTop(
                                            artist.id,
                                            artist.name
                                        )
                                );

                            }
                        );


                        if (
                            !tracks.length &&
                            !playlists.length &&
                            !artists.length
                        ) {

                            container.innerHTML =
                                '<div style="grid-column:1/-1;text-align:center;color:#777;">Nada encontrado.</div>';

                        }

                    },
                    350
                );

        }


        /*
           Toca uma música única pelo URI (resultado
           de busca de música). Usa start com uris —
           o jeito oficial de tocar uma faixa
           específica.
        */

        async function playTrackByUri(
            uri,
            name
        ) {

            if (
                spotifyCommandRunning
            )
                return;


            const token =
                await getToken();

            if (!token) {

                alert("Faça login no Spotify primeiro.");

                return;

            }

            if (
                !spotifyDeviceId &&
                !await waitUntilSpotifyReady()
            )
                return;


            spotifyCommandRunning = true;

            try {

                const response =
                    await fetch(
                        "https://api.spotify.com/v1/me/player/play?device_id=" +
                        encodeURIComponent(
                            spotifyDeviceId
                        ), {

                            method: "PUT",

                            headers: {

                                Authorization: "Bearer " + token,

                                "Content-Type": "application/json"

                            },

                            body: JSON.stringify({

                                uris: [uri]

                            })

                        }
                    );


                if (
                    !response.ok &&
                    response.status !== 204
                ) {

                    console.error(
                        "PLAY TRACK:",
                        await response.text()
                    );

                    showStatus(
                        "❌ Não foi possível tocar \"" +
                        name + "\"."
                    );

                    return;

                }


                showStatus(
                    "▶ Tocando: " + name
                );

                console.log(
                    "SEARCH PLAY: tocando", uri
                );

            } finally {

                setTimeout(
                    () => {
                        spotifyCommandRunning = false;
                    },
                    500
                );

            }

        }


        /*
           Toca o top 10 do artista pesquisado
           (via /artists/{id}/top-tracks).
        */

        async function playArtistTop(
            artistId,
            name
        ) {

            if (
                spotifyCommandRunning
            )
                return;


            const data =
                await spotifyAPI(
                    "/artists/" +
                    encodeURIComponent(artistId) +
                    "/top-tracks?market=BR"
                );


            if (
                !data ||
                !data.tracks ||
                !data.tracks.length
            ) {

                showStatus("❌ Top tracks indisponível.");

                return;

            }


            const uris =
                data.tracks.map(t => t.uri);


            await playUrisList(
                uris,
                "Top de " + name
            );

        }

           Toca uma lista de URIs pelo endpoint
           oficial (play com uris) — usado pela busca.

                            headers: {

                            },

                        }

                if (

        /* =========================================================
